name: P6 provider environment roadmap sync

on:
  push:
    branches:
      - agent/p6-provider-env-roadmap-sync

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p6-provider-env-roadmap-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record provider environment matrix
        run: |
          python scripts/run-p6-provider-env-roadmap-sync.py
          npx prettier --write \
            docs/implementation-plan.md \
            docs/roadmap/provider-readiness.md
          rm -f \
            .github/workflows/p6-provider-env-roadmap-sync.yml \
            scripts/run-p6-provider-env-roadmap-sync.py
      - name: Commit synchronized roadmap
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: record provider environment matrix"
          git push origin HEAD:agent/p6-provider-env-roadmap-sync
