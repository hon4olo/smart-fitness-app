name: Refine sync diagnostic

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'agent/isolate-sync-validation-failures'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/isolate-sync-validation-failures
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply diagnostic refinement
        run: python scripts/refine-sync-diagnostic.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Focused sync tests
        run: npx vitest run test/sync-push-validation-isolation.test.ts tests/settings-data-sync-status.test.ts

      - name: Full regression suite
        run: npm test

      - name: Expo export
        run: npx expo export --clear

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Diff validation
        run: git diff --check

      - name: Remove temporary workflow machinery
        run: |
          rm scripts/refine-sync-diagnostic.py
          rm .github/workflows/refine-sync-diagnostic.yml

      - name: Commit validated refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[ota] Surface sanitized sync rejection details"
          git push origin HEAD:agent/isolate-sync-validation-failures
