name: Verify remaining sync repair production OTA

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'release/verify-remaining-sync-ota'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Wait for production update
        env:
          EXPECTED_COMMIT: 4558bd25c1597f3561fe43b59f752c20d848d6d4
        run: |
          for attempt in 1 2 3 4 5 6; do
            eas update:list --branch production --platform ios --limit 15 --json > production-updates.json
            if node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('production-updates.json', 'utf8'));
          const expectedCommit = process.env.EXPECTED_COMMIT;
          const expectedText = 'Repair remaining strict sync payloads';
          const candidates = [];
          const walk = (value, inherited = {}) => {
            if (!value || typeof value !== 'object') return;
            if (Array.isArray(value)) {
              value.forEach((item) => walk(item, inherited));
              return;
            }
            const context = {
              message: typeof value.message === 'string' ? value.message : inherited.message ?? null,
              id: value.id ?? value.updateId ?? inherited.id ?? null,
              group: value.group ?? value.groupId ?? inherited.group ?? null,
              runtimeVersion: value.runtimeVersion ?? inherited.runtimeVersion ?? null,
              platform: value.platform ?? inherited.platform ?? null,
              createdAt: value.createdAt ?? inherited.createdAt ?? null,
              gitCommitHash: value.gitCommitHash ?? value.gitCommit ?? inherited.gitCommitHash ?? null,
            };
            if (
              context.gitCommitHash === expectedCommit ||
              context.message?.includes(expectedText)
            ) {
              candidates.push(context);
            }
            Object.values(value).forEach((item) => walk(item, context));
          };
          walk(payload);
          const match = candidates.find(
            (item) => (!item.runtimeVersion || item.runtimeVersion === '1.0.2') &&
              (!item.platform || item.platform === 'ios'),
          );
          if (!match) process.exit(1);
          fs.writeFileSync('verified-remaining-sync-ota.json', `${JSON.stringify(match, null, 2)}\n`);
          console.log('Verified production remaining sync repair OTA:', match);
          NODE
            then
              exit 0
            fi
            echo "Production update not visible yet (attempt ${attempt}/6)"
            sleep 20
          done
          cat production-updates.json
          exit 1

      - name: Upload verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: verified-remaining-sync-production-ota
          path: |
            production-updates.json
            verified-remaining-sync-ota.json
          if-no-files-found: error
          retention-days: 3
