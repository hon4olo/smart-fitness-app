name: Extract rejected sync key repair

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  extract:
    if: github.head_ref == 'agent/repair-stale-sync-idempotency'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/repair-stale-sync-idempotency
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply extraction
        run: python scripts/extract-rejected-sync-key-repair.py

      - name: Install dependencies
        run: npm ci

      - name: Validate source line limits
        run: node scripts/check-repository-file-lines.mjs

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Focused synchronization tests
        run: >-
          npx vitest run
          test/sync-push-validation-isolation.test.ts
          test/sync-stale-idempotency-repair.test.ts
          test/sync-failure-diagnostic.test.ts
          test/sync-coordinator.test.ts

      - name: Full regression suite
        run: npm test

      - name: Expo export
        run: npx expo export --clear

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Diff validation
        run: git diff --check

      - name: Remove temporary extraction machinery
        run: |
          rm scripts/extract-rejected-sync-key-repair.py
          rm .github/workflows/extract-rejected-sync-key-repair.yml

      - name: Commit validated extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract rejected sync key repair"
          git push origin HEAD:agent/repair-stale-sync-idempotency
