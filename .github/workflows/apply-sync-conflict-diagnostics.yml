name: Apply sync conflict diagnostics

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/sync-conflict-diagnostics'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4
        with:
          ref: agent/sync-conflict-diagnostics
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply diagnostics
        run: python scripts/apply-sync-conflict-diagnostics.py

      - name: Install dependencies
        run: npm ci

      - name: Repository file line audit
        run: npm run audit:lines

      - name: Changed file line limit
        run: npm run audit:changed-lines

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Focused conflict diagnostic tests
        run: npx vitest run test/sync-conflict-diagnostic.test.ts test/fitness-profile-conflict-resolution.test.ts

      - name: Full regression suite
        run: npm test

      - name: Expo export
        run: npx expo export --clear

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Diff validation
        run: git diff --check

      - name: Remove temporary workflow machinery
        run: |
          rm scripts/apply-sync-conflict-diagnostics.py
          rm .github/workflows/apply-sync-conflict-diagnostics.yml

      - name: Commit validated diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[ota] Surface exact sync conflict diagnostics"
          git push origin HEAD:agent/sync-conflict-diagnostics
