name: Publish remaining sync repair OTA

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  publish:
    if: github.head_ref == 'release/publish-remaining-sync-ota'
    runs-on: ubuntu-latest
    env:
      CI: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      EAS_BRANCH: production
      EAS_CHANNEL: production
      EXPECTED_RUNTIME_VERSION: '1.0.2'
      EXPECTED_COMMIT: 4558bd25c1597f3561fe43b59f752c20d848d6d4
    steps:
      - name: Checkout exact validated merge
        uses: actions/checkout@v4
        with:
          ref: 4558bd25c1597f3561fe43b59f752c20d848d6d4

      - name: Verify exact commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Link production channel
        run: eas channel:edit "$EAS_CHANNEL" --branch "$EAS_BRANCH" --non-interactive

      - name: Publish verified iOS update
        run: |
          eas update \
            --platform ios \
            --branch "$EAS_BRANCH" \
            --message "[ota] Repair remaining strict sync payloads (#166)" \
            --environment production \
            --json > eas-update.json
          cat eas-update.json

      - name: Verify published metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('eas-update.json', 'utf8'));
          const updates = Array.isArray(payload) ? payload : [payload];
          const iosUpdate = updates.find((item) => item && item.platform === 'ios');
          if (!iosUpdate) throw new Error('EAS did not return an iOS update record.');
          if (!iosUpdate.id) throw new Error('Published iOS update is missing an update ID.');
          if (iosUpdate.runtimeVersion !== process.env.EXPECTED_RUNTIME_VERSION) {
            throw new Error(`Runtime mismatch: expected ${process.env.EXPECTED_RUNTIME_VERSION}, received ${iosUpdate.runtimeVersion ?? 'missing'}.`);
          }
          const verified = {
            id: iosUpdate.id,
            group: iosUpdate.group ?? iosUpdate.groupId ?? null,
            platform: iosUpdate.platform,
            runtimeVersion: iosUpdate.runtimeVersion,
            branch: process.env.EAS_BRANCH,
            channel: process.env.EAS_CHANNEL,
            gitCommitHash: process.env.EXPECTED_COMMIT,
            message: '[ota] Repair remaining strict sync payloads (#166)',
          };
          fs.writeFileSync('verified-eas-update.json', `${JSON.stringify(verified, null, 2)}\n`);
          console.log('Verified EAS Update:', verified);
          NODE

      - name: Upload publication metadata
        uses: actions/upload-artifact@v4
        with:
          name: published-remaining-sync-ota
          path: |
            eas-update.json
            verified-eas-update.json
          if-no-files-found: error
          retention-days: 14
