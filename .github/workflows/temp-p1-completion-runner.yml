name: Temporary P1 Completion Runner

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Detect pending synchronization
        id: detect
        run: |
          if grep -q 'backend PR #95 exact green head' ROADMAP_PROGRESS.md; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Execute canonical synchronization script
        if: steps.detect.outputs.needed == 'true'
        shell: python
        run: |
          from pathlib import Path

          source = Path('.github/workflows/temp-p1-completion-sync.yml').read_text().splitlines()
          marker = '      - name: Update canonical roadmaps'
          start = source.index(marker)
          run_line = source.index('        run: |', start)
          end = source.index('      - name: Commit canonical synchronization', run_line)
          block = source[run_line + 1:end]
          if any(line and not line.startswith('          ') for line in block):
              raise SystemExit('Unexpected roadmap script indentation')
          code = '\n'.join(line[10:] if line else '' for line in block)
          exec(compile(code, 'temp-p1-completion-sync', 'exec'))
      - name: Commit canonical synchronization
        if: steps.detect.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP_PROGRESS.md docs/implementation-plan.md docs/roadmap/provider-readiness.md
          git commit -m "docs: mark provider readiness P1 complete"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
