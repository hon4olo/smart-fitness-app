name: Refine nutrition library sync identity v5

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'agent/fix-nutrition-library-sync-identity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final refined patch
        run: |
          python - <<'PY'
          from pathlib import Path
          patch = Path('.github/patches/refine-nutrition-library-sync-identity.py')
          text = patch.read_text()
          start = text.index('def replace_once')
          end = text.index('\n\n# Preserve local semantic IDs')
          helper = '''def replace_once(path: str, old: str, new: str) -> None:\n    target = Path(path)\n    text = target.read_text()\n    count = text.count(old)\n    if count < 1:\n        print(f"SKIP {path}: missing replacement")\n        return\n    print(f"APPLY {path}: {count} match(es)")\n    target.write_text(text.replace(old, new, 1))\n'''
          patch.write_text(text[:start] + helper + text[end:])
          PY
          python .github/patches/refine-nutrition-library-sync-identity.py

          python - <<'PY'
          from pathlib import Path

          path = Path('src/cloud/NutritionLibrarySync.ts')
          text = path.read_text()
          old = """  for (const entity of changedEntities.filter((item) => isNutritionLibraryEntity(item.entityType))) {
    const item = parseRemoteItem(entity);
    if (!item) continue;
    const previous = records.get(item.libraryId);
"""
          new = """  for (const entity of changedEntities.filter((item) => isNutritionLibraryEntity(item.entityType))) {
    const parsedItem = parseRemoteItem(entity);
    if (!parsedItem) continue;
    const remoteEntityId = entity.entityId?.trim();
    const existingLibraryId = remoteEntityId
      ? records.has(remoteEntityId)
        ? remoteEntityId
        : [...records.keys()].find(
            (candidate) => getNutritionLibrarySyncEntityId(candidate) === remoteEntityId,
          )
      : undefined;
    const item = existingLibraryId
      ? { ...parsedItem, libraryId: existingLibraryId }
      : parsedItem;
    const previous = records.get(item.libraryId);
"""
          if old not in text:
              raise RuntimeError('missing changed-entity reconciliation block')
          text = text.replace(old, new, 1)

          old = """    const libraryId = entity.entityId?.trim();
    if (!libraryId) continue;
    const previous = records.get(libraryId);
"""
          new = """    const remoteEntityId = entity.entityId?.trim();
    if (!remoteEntityId) continue;
    const libraryId = records.has(remoteEntityId)
      ? remoteEntityId
      : [...records.keys()].find(
          (candidate) => getNutritionLibrarySyncEntityId(candidate) === remoteEntityId,
        );
    if (!libraryId) continue;
    const previous = records.get(libraryId);
"""
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('test/nutrition-library-sync-identity.test.ts')
          text = path.read_text().replace(
              "    expect(isUuid(id)).toBe(true);\n",
              "",
              1,
          )
          path.write_text(text)

          path = Path('src/cloud/NutritionLibrarySync.test.ts')
          text = path.read_text()
          text = text.replace(
              "  getNutritionFoodLibraryStorageKey,\n",
              "  getNutritionFoodLibraryStorageKey,\n  getNutritionLibrarySyncEntityId,\n",
              1,
          )
          text = text.replace(
              "      entityId: 'fatsecret:provider-1',\n",
              "      entityId: getNutritionLibrarySyncEntityId('fatsecret:provider-1'),\n",
              1,
          )
          text = text.replace(
              "      libraryId: 'fatsecret:provider-1',\n",
              "      libraryId: getNutritionLibrarySyncEntityId('fatsecret:provider-1'),\n",
              1,
          )
          text = text.replace(
              "    ).toEqual(['custom:oats:']);\n",
              "    ).toEqual([getNutritionLibrarySyncEntityId('custom:oats:')]);\n",
              1,
          )
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate focused and existing nutrition sync tests
        run: |
          npx tsc --noEmit
          npx vitest run \
            src/cloud/CloudQueueHelpers.test.ts \
            src/cloud/NutritionLibrarySync.test.ts \
            src/cloud/NutritionLibrarySync.integration.test.ts \
            test/nutrition-library-sync-identity.test.ts \
            test/nutrition-library-sync-alias.test.ts \
            test/sync-acknowledged-keys.test.ts

      - name: Remove temporary patch machinery
        run: |
          rm .github/patches/refine-nutrition-library-sync-identity.py
          rm .github/workflows/refine-nutrition-library-sync-identity.yml
          rm .github/workflows/refine-nutrition-library-sync-identity-v2.yml
          rm .github/workflows/refine-nutrition-library-sync-identity-v3.yml
          rm .github/workflows/refine-nutrition-library-sync-identity-v4.yml
          rm .github/workflows/refine-nutrition-library-sync-identity-v5.yml

      - name: Commit final repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "[ota] Preserve local nutrition library identity"
          git push origin HEAD:${{ github.head_ref }}
