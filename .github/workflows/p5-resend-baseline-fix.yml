name: P5 Resend baseline fix

on:
  push:
    branches:
      - agent/p5-resend-composition-roadmap-sync

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p5-resend-composition-roadmap-sync
      - name: Fix malformed baseline evidence
        run: python -c "from pathlib import Path; p=Path('docs/implementation-plan.md'); s=p.read_text(); old='44604b216bef723680fdd12f3a5d9d100bb70e3b``;'; new='44604b216bef723680fdd12f3a5d9d100bb70e3b`;'; assert s.count(old)==1; p.write_text(s.replace(old,new,1))"
      - name: Remove one-time runner
        run: rm -f .github/p5-resend-baseline-fix-trigger .github/workflows/p5-resend-baseline-fix.yml
      - name: Commit final docs-only head
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: fix Resend composition baseline"
          git push origin HEAD:agent/p5-resend-composition-roadmap-sync
