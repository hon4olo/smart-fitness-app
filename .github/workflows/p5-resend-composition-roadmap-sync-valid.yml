name: P5 Resend composition roadmap sync valid

on:
  push:
    branches:
      - agent/p5-resend-composition-roadmap-sync

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p5-resend-composition-roadmap-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Synchronize roadmap
        run: |
          python -c "import base64; exec(base64.b64decode('  nJycKcm9hZG1hcCA9IHJlcGxhY2Vfc2VjdGlvbigKICAgIHJvYWRtYXAsCiAgICAnIyMgUGhhc2UgUDUg4oCUIHBhc3N3b3JkLXJlc2V0IHByb2R1Y3QgYW5kIGRlbGl2ZXJ5IHJlYWRpbmVzcycsCiAgICAnIyMgUGhhc2UgUDYg4oCUI '))"
          npx prettier --write docs/implementation-plan.md docs/roadmap/provider-readiness.md
      - name: Commit synchronized roadmap
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/implementation-plan.md docs/roadmap/provider-readiness.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: record Resend composition readiness"
          git push origin HEAD:agent/p5-resend-composition-roadmap-sync
