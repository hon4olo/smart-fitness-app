name: Validate Social S7.6 sequence guards

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/s7-6-mobile-sequence-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'agent/social-workout-post-image-s7-6'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/social-workout-post-image-s7-6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guard late media callbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/features/social/useSocialWorkoutPostMedia.ts')
          source = path.read_text()

          source, progress_count = re.subn(
              r'(?m)^(\s*)onProgress: setUploadProgress,$',
              lambda match: (
                  f'{match.group(1)}onProgress: (value) => {{\n'
                  f'{match.group(1)}  if (isCurrent(requestSequence)) setUploadProgress(value);\n'
                  f'{match.group(1)}}},'
              ),
              source,
              count=1,
          )
          if progress_count != 1:
              raise SystemExit('upload progress target mismatch')

          recovery_pattern = re.compile(
              r'    recoveredPendingKey\.current = recoveryKey;\n'
              r'    void recoverPendingSocialWorkoutPostImage\(\)\n'
              r'      \.then\(\(selected\) => \{\n'
              r'        if \(selected\) void uploadSelected\(selected\);\n'
              r'      \}\)\n'
              r'      \.catch\(\(error: unknown\) => \{\n'
              r'        setErrorMessage\(getSocialWorkoutPostMediaErrorMessage\(error, copy\)\);\n'
              r'      \}\);'
          )
          recovery = '''    recoveredPendingKey.current = recoveryKey;
          const requestSequence = sequence.current;
          void recoverPendingSocialWorkoutPostImage()
            .then((selected) => {
              if (selected && isCurrent(requestSequence)) {
                void uploadSelected(selected);
              }
            })
            .catch((error: unknown) => {
              if (isCurrent(requestSequence)) {
                setErrorMessage(getSocialWorkoutPostMediaErrorMessage(error, copy));
              }
            });'''
          source, recovery_count = recovery_pattern.subn(recovery, source, count=1)
          if recovery_count != 1:
              raise SystemExit('pending recovery target mismatch')
          path.write_text(source)
          PY
      - name: Format and validate
        shell: bash
        run: |
          npx prettier --write src/features/social/useSocialWorkoutPostMedia.ts
          npx tsc --noEmit
          npm test
      - name: Publish hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/features/social/useSocialWorkoutPostMedia.ts
          git diff --cached --check
          git commit -m 'fix: guard late workout media callbacks'
          git push origin HEAD:agent/social-workout-post-image-s7-6
