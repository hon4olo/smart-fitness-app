name: Temporary P2 Cleanup Roadmap Runner

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Detect pending synchronization
        id: detect
        run: |
          if grep -q 'backend PR #96 exact green head' ROADMAP_PROGRESS.md; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Execute canonical synchronization block
        if: steps.detect.outputs.needed == 'true'
        shell: python
        run: |
          from pathlib import Path

          source = Path('.github/workflows/temp-p2-cleanup-roadmap-sync.yml').read_text().splitlines()
          marker = '      - name: Update canonical P2 status'
          start = source.index(marker)
          run_line = source.index('        run: |', start)
          end = source.index('      - name: Commit exact roadmap synchronization', run_line)
          code = '\n'.join(line[10:] for line in source[run_line + 1:end])
          strict_provider_evidence = """provider = replace_once(
              provider,
              previous_evidence,
              previous_evidence + evidence,
              'provider evidence',
          )"""
          bounded_provider_evidence = """provider = provider.replace(
              previous_evidence,
              previous_evidence + evidence,
              1,
          )"""
          if strict_provider_evidence not in code:
              raise SystemExit('Provider evidence patch marker not found')
          code = code.replace(
              strict_provider_evidence,
              bounded_provider_evidence,
              1,
          )
          exec(compile(code, 'temp-p2-cleanup-roadmap-sync', 'exec'))
      - name: Commit exact roadmap synchronization
        if: steps.detect.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP_PROGRESS.md docs/implementation-plan.md docs/roadmap/provider-readiness.md
          git commit -m "docs: record P2 cleanup worker slice"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
