name: Temporary Sync Social Owned Content Docs

on:
  push:
    branches:
      - agent/sync-social-owned-content-source-docs

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sync-social-owned-content-source-docs
      - name: Synchronize roadmap documents
        run: python .github/scripts/temporary_sync_social_owned_content_docs.py
      - name: Commit synchronized documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-plan.md docs/current-status.md docs/handoffs/latest.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: record audited Social owned-content source"
          git push origin HEAD:agent/sync-social-owned-content-source-docs
