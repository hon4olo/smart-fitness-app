name: Mobile CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-add-food-boundary:
    if: github.head_ref == 'agent/nutrition-add-food-boundary'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: agent/nutrition-add-food-boundary
          fetch-depth: 0

      - name: Apply exact Add Food subscription split
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/nutrition/add-food.tsx')
          source = path.read_text()

          old_import = "import { useAppContext } from '@/context/AppContext';"
          new_import = "import { useAppActions, useNutritionState } from '@/context/AppContext';"
          if source.count(old_import) != 1:
              raise SystemExit(f'expected one compatibility import, found {source.count(old_import)}')
          source = source.replace(old_import, new_import, 1)

          old_block = """  const {
    addFoodEntries,
    addFoodEntry,
    addMealTemplate,
    deleteFoodEntry,
    deleteMealTemplate,
    foodEntries,
    mealTemplates,
    updateFoodEntry,
  } = useAppContext();"""
          new_block = """  const { foodEntries, mealTemplates } = useNutritionState();
  const {
    addFoodEntries,
    addFoodEntry,
    addMealTemplate,
    deleteFoodEntry,
    deleteMealTemplate,
    updateFoodEntry,
  } = useAppActions();"""
          if source.count(old_block) != 1:
              raise SystemExit(f'expected one Add Food context block, found {source.count(old_block)}')
          source = source.replace(old_block, new_block, 1)

          if 'useAppContext' in source:
              raise SystemExit('compatibility hook remains in Add Food')
          path.write_text(source)

          test_path = Path('test/nutrition-state-boundary.test.ts')
          test_source = test_path.read_text()
          old_paths = """  test.each([
    'src/app/(tabs)/nutrition.tsx',
    'src/app/nutrition/date-picker.tsx',
  ])('%s uses only focused Nutrition state', (path) => {"""
          new_paths = """  test.each([
    'src/app/(tabs)/nutrition.tsx',
    'src/app/nutrition/add-food.tsx',
    'src/app/nutrition/date-picker.tsx',
  ])('%s uses only focused Nutrition state', (path) => {"""
          if test_source.count(old_paths) != 1:
              raise SystemExit('focused Nutrition consumer list changed unexpectedly')
          test_source = test_source.replace(old_paths, new_paths, 1)

          old_assertions = """    expect(source).toContain('useNutritionState');
    expect(source).not.toContain('useAppContext');"""
          new_assertions = """    expect(source).toContain('useNutritionState');
    expect(source).not.toContain('useAppContext');
    if (path.endsWith('add-food.tsx')) {
      expect(source).toContain('useAppActions');
    }"""
          if test_source.count(old_assertions) != 1:
              raise SystemExit('focused Nutrition assertions changed unexpectedly')
          test_path.write_text(test_source.replace(old_assertions, new_assertions, 1))

          doc_path = Path('docs/architecture/nutrition-state-boundary.md')
          doc = doc_path.read_text()
          doc = doc.replace('Status: first migration slice.', 'Status: pure Nutrition consumer migration complete.', 1)
          doc = doc.replace(
              """Add Food remains deferred to a separate slice because it combines entries, meal templates, multiple mutations, and substantial local editor state.""",
              """The second slice migrated `src/app/nutrition/add-food.tsx`. It reads `foodEntries` and `mealTemplates` through `useNutritionState` and receives its mutations from stable `useAppActions`. Local editor state, food search, scanner, favorites, library integration, routes, and UI behavior remain unchanged.""",
              1,
          )
          doc_path.write_text(doc)
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git diff --check

      - name: Commit bounded Add Food migration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            .github/workflows/ci.yml \
            src/app/nutrition/add-food.tsx \
            test/nutrition-state-boundary.test.ts \
            docs/architecture/nutrition-state-boundary.md
          git commit -m 'refactor: migrate Add Food to focused Nutrition state'
          git push origin HEAD:agent/nutrition-add-food-boundary

# synchronize trigger
