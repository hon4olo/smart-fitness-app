name: Apply P6 managed-media core roadmap sync

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p6-managed-media-core-roadmap
          fetch-depth: 0
      - name: Synchronize canonical roadmaps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          backend_head = 'ccbb98c164efada298a9768d329f9150757ecbf1'
          backend_merge = '1de40eb713a810bdc8875acebccd61d3b8f8d059'
          mobile_main = '6e64b91eb5f7ed297e516aecb1baee16d4f4a698'

          implementation_path = Path('docs/implementation-plan.md')
          implementation = implementation_path.read_text()
          baseline_start = 'Before this documentation synchronization slice:\n\n'
          baseline_end = 'Always re-check exact `main` and open pull requests in both repositories before starting another slice.'
          start = implementation.index(baseline_start) + len(baseline_start)
          end = implementation.index(baseline_end)
          implementation = implementation[:start] + f'''- mobile `main`: `{mobile_main}`;
          - backend `main`: `{backend_merge}`;
          - backend PR #120 exact green head: `{backend_head}`;
          - backend PR #120 merge: `{backend_merge}`;
          - open mobile pull requests before this documentation slice: none;
          - open backend pull requests after PR #120 merge: none;
          - public media uploads, real provider-backed media processing, and password-reset delivery remain disabled;
          - no provider account, credential, deployment, worker schedule, DNS mutation, native build, or production activation is implied by source completion.

          ''' + implementation[end:]

          marker = '- PR #119, exact green head `2d2ae0aca373ce471ade00c9e721b3c3f2557643`, merge `15c1a939df06d84a38525f1558a2fa7a4ae2754f`: secret-safe synthetic auth/session scenario with replay cleanup and privacy-safe evidence.\n'
          if implementation.count(marker) != 1:
              raise SystemExit('Expected one implementation PR #119 marker')
          implementation = implementation.replace(
              marker,
              marker + f'- PR #120, exact green head `{backend_head}`, merge `{backend_merge}`: pre-enablement managed-media lifecycle core with private-quarantine replays, bounded cleanup, and privacy-safe evidence.\n',
              1,
          )

          section_start = '### Active P6 slice — managed-media staging scenario contracts'
          section_end = 'Password-reset delivery/expiry/replay/session-revocation scenario composition remains the next separate P6 slice after managed media.'
          start = implementation.index(section_start)
          end = implementation.index(section_end)
          section = f'''### Completed P6 slice — pre-enablement managed-media lifecycle core

          Backend PR #120, exact green head `{backend_head}`, merge `{backend_merge}`, added:

          - an injected internal operational adapter boundary because the released public upload route correctly returns `503` while `SOCIAL_MEDIA_UPLOADS_ENABLED=false`;
          - no hidden staging HTTP route and no temporary public capability enablement;
          - strict synthetic fixture and idempotency scoping, PNG/JPEG byte limits, and approved signed-upload DNS host validation;
          - pre- and post-scenario public capability-disabled checks;
          - private upload creation, exact create replay, signed `PUT`, completion, exact completion replay, owner read, deletion, and exact deletion replay;
          - strict `upload_pending` → `quarantined` → `deleted` invariants with public descriptor required absent;
          - memory-only asset ID, state versions, source hash, signed URL/headers, idempotency key, and fixture bytes;
          - one bounded best-effort cleanup after post-create failure, including the regression case where a strict create DTO contains identity but violates lifecycle invariants;
          - fixed privacy-safe evidence with no dynamic IDs, URLs, headers, object keys, hashes, provider payloads, media bytes, request/response bodies, or raw exceptions;
          - deterministic no-network tests for successful lifecycle, replays, capability regressions, unsafe signed scope, malformed responses, identity mismatch, cleanup success/failure, and non-synthetic fixtures;
          - explicit scope stopping at private quarantine: worker processing, moderation, immutable delivery, expiry, and cleanup-worker evidence remain separate.

          The exact PR #120 head passed lint, formatting, TypeScript build, production configuration validation, migrations and idempotency, migrated-schema integration, PostgreSQL Social API integration, the complete Vitest suite, and production startup/health. Every new hand-written TypeScript file remains below 500 physical lines.

          ### Active P6 slice — managed-media staging operational adapter

          Next source work:

          - bind the lifecycle core to one synthetic owner through the secret-safe auth/session contract from PR #119;
          - construct an internal staging adapter from the configured database, `SocialMediaUploadService`, private object storage, image validator, optional delivery provider, and a strict public capability verifier;
          - instantiate the internal service with operational execution allowed while the public capability contract remains disabled;
          - provide a bounded signed-upload transport that rejects redirects and unexpected statuses without reading or persisting provider response bodies;
          - guarantee synthetic account and asset cleanup on success, failure, and interrupted-run replay;
          - add a redacted CLI that loads secrets and fixture bytes through approved non-repository paths only after exact staging confirmation;
          - keep CI fully offline through injected database/service/provider/transport fixtures;
          - keep real staging/provider execution, deployment, workers, credentials, DNS, native builds, and capability activation external.

          Subsequent managed-media slices must add bounded processing/recovery polling, immutable delivery validation, stale-upload expiry, cleanup-worker evidence, and authorized worker-order composition.

          '''
          implementation = implementation[:start] + section + implementation[end:]
          implementation_path.write_text(implementation)

          roadmap_path = Path('docs/roadmap/provider-readiness.md')
          roadmap = roadmap_path.read_text()
          old_status = 'Status: active. Configuration, policy, rollout/rollback ordering, the fail-closed runner, and the secret-safe synthetic auth/session scenario are source-complete. Managed-media scenario contracts are next.'
          new_status = 'Status: active. Configuration, policy, rollout/rollback ordering, the fail-closed runner, synthetic auth/session scenario, and pre-enablement managed-media lifecycle core are source-complete. The staging operational adapter is next.'
          if roadmap.count(old_status) != 1:
              raise SystemExit('Expected one provider P6 status line')
          roadmap = roadmap.replace(old_status, new_status, 1)

          roadmap_marker = '- backend PR #119 exact green head `2d2ae0aca373ce471ade00c9e721b3c3f2557643`, merge `15c1a939df06d84a38525f1558a2fa7a4ae2754f`;\n'
          if roadmap.count(roadmap_marker) != 1:
              raise SystemExit('Expected one provider PR #119 marker')
          roadmap = roadmap.replace(
              roadmap_marker,
              roadmap_marker + f'- backend PR #120 exact green head `{backend_head}`, merge `{backend_merge}`;\n',
              1,
          )

          old_check = '- [ ] add managed-media signed upload, processing, delivery, deletion, cleanup, replay, and idempotency scenarios using synthetic non-production fixtures;'
          new_check = '''- [x] add the pre-enablement managed-media private-quarantine lifecycle core with signed upload, create/complete/delete replay checks, disabled-capability verification, and bounded failure cleanup;
          - [ ] add the staging operational adapter and redacted CLI that compose synthetic auth, configured internal services/providers, and fixture loading without enabling the public capability;
          - [ ] add managed-media processing, recovery, immutable delivery, stale-upload expiry, cleanup-worker, and authorized worker-order scenarios using synthetic non-production fixtures;'''
          if roadmap.count(old_check) != 1:
              raise SystemExit('Expected one managed-media checklist item')
          roadmap = roadmap.replace(old_check, new_check, 1)

          next_start = '### Next bounded slice — managed-media staging scenario contracts'
          next_end = 'Password-reset scenario composition remains a separate subsequent P6 slice. Actual provider staging execution remains external and requires direct authorization.'
          start = roadmap.index(next_start)
          end = roadmap.index(next_end)
          next_section = f'''### Completed pre-enablement managed-media lifecycle core

          Backend PR #120 exact green head `{backend_head}`, merge `{backend_merge}`, completed:

          - [x] explicit internal operational adapter boundary instead of a hidden HTTP route or temporary public capability enablement;
          - [x] synthetic fixture/idempotency scope and bounded PNG/JPEG validation;
          - [x] approved HTTPS signed-upload hostname, expiry, content type, and exact content length checks;
          - [x] public capability-disabled verification before and after execution;
          - [x] create, signed upload, complete, owner read, delete, and exact create/complete/delete replay validation;
          - [x] strict private-quarantine state and source invariants with no public descriptor;
          - [x] memory-only dynamic media values and fixed privacy-safe evidence;
          - [x] bounded best-effort cleanup after any post-create failure;
          - [x] regression coverage proving strict create identity is retained before lifecycle and signed-scope checks;
          - [x] deterministic no-network tests in the canonical backend suite;
          - [x] source and test files below 500 physical lines.

          ### Next bounded slice — managed-media staging operational adapter

          Required source behavior:

          - [ ] compose the generic disabled-capability verifier and secret-safe synthetic auth/session lifecycle around the managed-media core;
          - [ ] bind one synthetic owner to `SocialMediaUploadService` through the configured database, private storage, image validator, cleanup service, and optional delivery provider;
          - [ ] permit only the internal operational service instance to execute while the public capability contract remains disabled;
          - [ ] provide a bounded signed-upload `PUT` transport with exact method/headers/body, no redirect, no automatic retry, and accepted-status validation;
          - [ ] load synthetic fixture bytes and auth/provider secrets only through explicit approved paths or secret stores after exact staging confirmation;
          - [ ] delete the synthetic media and account on success and perform one bounded cleanup path after failure;
          - [ ] emit one composed evidence file without tokens, email, password, user/asset IDs, state versions, signed URL/headers, object keys, source hashes, provider payloads, or media bytes;
          - [ ] add deterministic offline tests for service wiring, capability-disable invariants, secret lifetime, upload transport, cleanup ordering, and interrupted-run recovery;
          - [ ] no public route bypass, invented endpoint, production target, deployment, worker scheduling, native build, or activation command.

          Subsequent slices must cover processing/recovery polling, immutable delivery, stale-upload expiry, cleanup workers, and worker-order evidence.

          '''
          roadmap = roadmap[:start] + next_section + roadmap[end:]
          roadmap_path.write_text(roadmap)
          PY

          npx prettier --write docs/implementation-plan.md docs/roadmap/provider-readiness.md
          node scripts/check-repository-file-lines.mjs
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/implementation-plan.md docs/roadmap/provider-readiness.md .github/workflows/ci.yml
          git commit -m "docs: record managed-media smoke core"
          git push
