name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  roadmap-sync:
    if: github.head_ref == 'docs/social-s7-6-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: docs/social-s7-6-complete
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update canonical Social roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('ROADMAP_PROGRESS.md')
          index = index_path.read_text()

          replacements = {
              '- mobile `main`: `aa693a959a16b20c125c4358d31c2107624a5258`;': '- mobile `main`: `7583e6cda4694b8ff9c0690235712f6b876ec235`;',
              '- backend `main`: `86f773c92d682c5a42e090a00a7be8908e881c0b`;': '- backend `main`: `6a492cc1636108e52de5eae91bbed217c81c81a5`;',
              'Status: backend S7.1-S7.5 and mobile S7.5 are source-complete and merged. S7.6 bounded one-image workout posts is the active source-code slice.': 'Status: Social S7.1-S7.6 is source-complete and merged across backend and mobile. S7.7 manual review, appeal, and retention operations is the active source-code slice.',
          }
          changed = False
          for old, new in replacements.items():
              if old in index:
                  if index.count(old) != 1:
                      raise SystemExit(f'ROADMAP replacement mismatch: {old}')
                  index = index.replace(old, new)
                  changed = True
              elif new not in index:
                  raise SystemExit(f'ROADMAP expected state missing: {old}')

          if '### S7.6 One-image workout-post flow — active' in index:
              s76_pattern = re.compile(
                  r'### S7\.6 One-image workout-post flow — active\n.*?(?=### S7 exit criteria)',
                  re.S,
              )
              s76_replacement = '''### S7.6 One-image workout-post flow — source-complete

Merged backend PR #87:

- exact green head: `3cd3e9aa5815edf7968f0aecaa9377cb3414e7ee`;
- merge SHA: `6a492cc1636108e52de5eae91bbed217c81c81a5`.

Completed backend contract:

- at most one approved owner-scoped `workout_post_image` asset can bind to an immutable workout-post snapshot by asset ID and expected state version;
- ownership, type, approval, state-version, idempotency, already-attached, deletion, account-deletion, report-evidence, and restriction/block boundaries are enforced transactionally;
- public workout-post DTO schema version 2 projects only a strict nullable approved descriptor and never exposes quarantine/master object data or private storage details;
- asset deletion removes the public projection without rewriting the immutable workout snapshot;
- migration, PostgreSQL API, deletion-race, account-cascade, and full backend CI coverage are green.

Merged mobile PR #355:

- exact green head: `dea24b1f3fb7c5a7359818f527808ff9d2c1a14e`;
- merge SHA: `7583e6cda4694b8ff9c0690235712f6b876ec235`.

Completed mobile source flow:

- workout-post DTO v2 and managed image descriptors fail closed on unknown, malformed, wrong-type, private-object, or untrusted URL data;
- the existing Expo SDK 56 picker/manipulator/signed-upload lifecycle is reused for a single optional local preview and bounded JPEG preprocessing;
- upload progress, completion, processing, review-required, approved, rejected, failed, deleted, stale, offline, expiry, session, retry, refresh, replacement, and removal states are localized in English and Russian;
- publication remains explicitly confirmed, preserves existing share controls, and binds media only after approval;
- restart-safe account/session draft state stores only asset ID and local preview URI;
- replacement cleanup and asynchronous state updates are sequence-isolated across account/session changes, late upload progress, and pending picker recovery;
- approved variants render in cards, profile lists, following feed, and post detail, while non-public or deleted assets project as `image: null`;
- line audits, TypeScript, contract tests, 1164-test regression, iOS/Android/Web export, and Expo Doctor are green.

Activation boundary:

- no OTA/EAS publish, native build, device install, backend deployment, migration execution outside CI, credentials change, real storage/CDN/moderation-provider activation, or public media activation was performed;
- physical-device validation still requires a future explicitly authorized matching native build.

### S7.7 Manual review, appeal, and retention operations — active

Implement next as source-only bounded contracts:

- add an operator-only queue for media assets in `review_required`, separate from the public Social API and existing report queue;
- support explicit audited operator decisions to approve or reject a reviewed asset without trusting provider output or exposing private object details;
- add owner-visible appeal submission for eligible rejected media with bounded reason codes/text, idempotency, rate limits, and no automatic publication;
- keep appealed or reopened assets non-public until a new explicit terminal operator decision;
- define bounded retention deadlines for quarantine uploads, moderation masters, rejected/failed/review evidence, approved originals, derivatives, and deletion tombstones;
- add restart-safe cleanup claims, retries, stale-worker recovery, deletion races, account deletion, legal-hold-safe boundaries, and privacy-safe audit records;
- add exact authorization, ownership, duplicate, stale-state, appeal eligibility, decision transition, retention, cleanup, and account-deletion tests;
- do not add a public staff/admin HTTP API, activate real providers, deploy, execute migrations outside CI, or enable public uploads without explicit authorization.

'''
              index, count = s76_pattern.subn(s76_replacement, index, count=1)
              if count != 1:
                  raise SystemExit('S7.6 section replacement mismatch')
              changed = True
          elif '### S7.7 Manual review, appeal, and retention operations — active' not in index:
              raise SystemExit('S7.7 section missing')

          if '1. Implement S7.6 the bounded one-image workout-post flow' in index:
              order_pattern = re.compile(
                  r'## Immediate execution order\n\n1\. Implement S7\.6.*?3\. Run staging calibration, physical-device, release, rollback, privacy, and legal gates only with the required authorization and configuration\.',
                  re.S,
              )
              order_replacement = '''## Immediate execution order

1. Define and implement S7.7 operator manual review, owner appeal, and bounded retention/cleanup contracts.
2. Complete source-level false-positive, stale-worker, deletion, account-cleanup, and privacy validation for the managed-media pipeline.
3. Run staging calibration, physical-device, release, rollback, privacy, and legal gates only with the required authorization and configuration.'''
              index, count = order_pattern.subn(order_replacement, index, count=1)
              if count != 1:
                  raise SystemExit('execution order replacement mismatch')
              changed = True

          if 'with Social S7.6 bounded one-image workout posts as the active source-code slice' in index:
              starter_pattern = re.compile(r'## New-chat starter prompt\n\n> .*\n', re.S)
              starter_replacement = '''## New-chat starter prompt

> Continue the Smart Fitness roadmap from `ROADMAP_PROGRESS.md`, with Social S7.7 manual media review, owner appeal, and bounded retention/cleanup operations as the active source-code slice. Work autonomously through meaningful bounded slices instead of stopping after micro-changes. At the start, verify exact `main` and open PRs for `hon4olo/smart-fitness-app` and `hon4olo/smart-fitness-backend`; read both `AGENTS.md`, mobile `PROJECT_LEARNINGS.md`, `ROADMAP_PROGRESS.md`, `docs/roadmap/social-network.md`, and only the files relevant to the current slice. Do not restart already completed Social S0-S7.6 work. Reuse the merged managed-media lifecycle, strict owner/public descriptors, signed private upload, moderation, delivery, deletion, cleanup, and one-image workout-post contracts. Keep review-required and appealed assets non-public, keep operator actions audited and separate from public APIs, make retention and cleanup restart-safe, localize owner-visible appeal states, and preserve private workout/profile boundaries. Run full blocking CI, inspect review threads, and merge only exact green heads. Do not publish OTA, create/install native builds, deploy backend changes, execute migrations outside CI, activate staging/production, configure credentials, connect real storage/CDN/moderation providers, or enable public image uploads without explicit authorization.
'''
              index, count = starter_pattern.subn(starter_replacement, index, count=1)
              if count != 1:
                  raise SystemExit('starter prompt replacement mismatch')
              changed = True
          index_path.write_text(index)

          social_path = Path('docs/roadmap/social-network.md')
          social = social_path.read_text()
          social_replacements = {
              'Updated: 2026-08-01': 'Updated: 2026-08-02',
              'Status: architecture approved; implementation not started.': 'Status: source-complete through managed avatars and bounded one-image workout posts; manual review, appeal, retention, and cleanup operations remain active.',
              '- [ ] use a fitness-specific image policy so ordinary adult workout photos, posing, sportswear, bodybuilding stages, and non-erotic progress photos are not automatically treated as explicit content;': '- [x] use a fitness-specific image policy so ordinary adult workout photos, posing, sportswear, bodybuilding stages, and non-erotic progress photos are not automatically treated as explicit content;',
              '- [ ] never claim or persist a precise age inferred from appearance; combine possible-minor signals with sexual-content signals conservatively;': '- [x] never claim or persist a precise age inferred from appearance; combine possible-minor signals with sexual-content signals conservatively;',
              '- [ ] migrate avatars from arbitrary URLs to managed approved media assets;': '- [x] migrate avatars from arbitrary URLs to managed approved media assets;',
              '- [ ] add one moderated image per workout post before supporting multi-image posts;': '- [x] add one moderated image per workout post before supporting multi-image posts;',
              '- [ ] keep images with `pending`, `review_required`, or `rejected` status out of profiles, feeds, notifications, and public post DTOs;': '- [x] keep images with `pending`, `review_required`, or `rejected` status out of profiles, feeds, notifications, and public post DTOs;',
              '- [ ] use asynchronous media status polling or bounded refresh rather than keeping the upload request open through full processing;': '- [x] use asynchronous media status polling or bounded refresh rather than keeping the upload request open through full processing;',
              '- [ ] add localized upload, compression, pending-moderation, rejected, review-required, offline, retry, and deleted-asset states;': '- [x] add localized upload, compression, pending-moderation, rejected, review-required, offline, retry, and deleted-asset states;',
              '21. [ ] S7 object storage, quarantine, managed-avatar migration, normalization, compression, and variants.': '21. [x] S7 object storage, quarantine, managed-avatar migration, normalization, compression, and variants.',
              '22. [ ] S7 one-image workout-post contract with image moderation, OCR, placeholders, CDN delivery, and mobile states.': '22. [x] S7 one-image workout-post contract with image moderation, OCR, placeholders, CDN delivery, and mobile states.',
          }
          for old, new in social_replacements.items():
              if old in social:
                  if social.count(old) != 1:
                      raise SystemExit(f'social roadmap replacement mismatch: {old}')
                  social = social.replace(old, new)
                  changed = True
              elif new not in social:
                  raise SystemExit(f'social roadmap expected state missing: {old}')
          social_path.write_text(social)

          if not changed:
              print('Roadmap already synchronized')
          PY

      - name: Format and publish docs
        shell: bash
        run: |
          npx prettier --write ROADMAP_PROGRESS.md docs/roadmap/social-network.md
          npx prettier --check ROADMAP_PROGRESS.md docs/roadmap/social-network.md
          grep -F 'S7.7 Manual review, appeal, and retention operations — active' ROADMAP_PROGRESS.md
          grep -F '23. [ ] Manual review, appeal, retention, threshold calibration, and false-positive validation.' docs/roadmap/social-network.md
          git diff --check
          if git diff --quiet -- ROADMAP_PROGRESS.md docs/roadmap/social-network.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP_PROGRESS.md docs/roadmap/social-network.md
          git commit -m 'docs: complete Social S7.6 roadmap'
          git push origin HEAD:docs/social-s7-6-complete

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository file line audit
        id: repository-lines
        run: node scripts/check-repository-file-lines.mjs > repository-line-audit.log 2>&1

      - name: Upload repository line audit log
        if: failure() && steps.repository-lines.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-repository-line-audit-log
          path: repository-line-audit.log
          if-no-files-found: error
          retention-days: 3

      - name: Changed file line limit
        run: node scripts/check-changed-file-lines.mjs

      - name: TypeScript
        id: typescript
        run: npx tsc --noEmit > typescript.log 2>&1

      - name: Upload TypeScript log
        if: failure() && steps.typescript.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-typescript-log
          path: typescript.log
          if-no-files-found: error
          retention-days: 3

      - name: Coach and sync contract tests
        id: contract-tests
        run: >-
          npx vitest run
          src/auth/createAuthService.session-cache.test.ts
          src/auth/migrating-token-manager.test.ts
          src/context/appContext/AppMutationQueue.test.ts
          src/context/appContext/AppMutationOutboxRecovery.test.ts
          src/context/applySyncPullResult.concurrent.test.ts
          src/context/syncConflictCount.test.ts
          src/context/syncConflictPersistence.test.ts
          src/api/coach.test.ts
          src/api/coach.capabilities.v3.test.ts
          src/api/coach.capabilities.v4.test.ts
          src/api/coach.capabilities.v5.test.ts
          src/api/coach.capabilities.v6.test.ts
          src/api/coach.capabilities.v7.test.ts
          src/api/coach.safety-recovery.test.ts
          src/api/coach.combined.test.ts
          src/api/coach.strength-strategy.test.ts
          src/api/coach.strength-confirmation.test.ts
          src/features/coach/combinedCoachViewModel.test.ts
          src/features/coach/combinedCoachProposalViewModel.test.ts
          src/features/coach/recoveryCheckInForm.test.ts
          src/features/coach/userLimitationForm.test.ts
          src/features/coach/safetyRecoveryLocalSummary.test.ts
          src/features/coach/safetyRecoveryReviewSnapshot.test.ts
          src/features/coach/safetyRecoveryViewModel.test.ts
          src/features/coach/strengthCoachViewModel.test.ts
          src/features/coach/strengthStrategyViewModel.test.ts
          src/features/coach/nutritionCoachViewModel.test.ts
          src/features/nutrition/addFoodModel.test.ts
          src/features/progress/bodyMeasurementModel.test.ts
          src/features/progress/safetyRecoveryProgressAnalytics.test.ts
          src/features/progress/safetyRecoveryWeeklyTrend.test.ts
          src/features/workouts/workoutHistoryViewModel.test.ts
          src/features/workouts/workoutSafetyGateModel.test.ts
          src/features/workouts/workoutSafetySessionMetadata.test.ts
          src/cloud/createProductionCloudProvider.auth-refresh.test.ts
          src/cloud/CloudConflictResolver.two-device.test.ts
          src/cloud/TrainingProgramConflict.two-device.test.ts
          src/cloud/MealTemplateConflict.two-device.test.ts
          src/cloud/CustomExerciseConflict.two-device.test.ts
          src/cloud/BodyMeasurementConflict.two-device.test.ts
          src/cloud/NutritionTargetConflict.two-device.test.ts
          src/cloud/SafetyRecoveryConflict.two-device.test.ts
          src/cloud/SyncCoordinatorDeleteConflict.two-device.test.ts
          src/cloud/BodyMeasurementSync.test.ts
          src/cloud/CustomExerciseSyncPlanner.test.ts
          src/cloud/CustomExerciseRemoteSync.test.ts
          src/cloud/WorkoutSessionSync.test.ts
          src/cloud/WorkoutSessionSafetyMetadataSync.test.ts
          src/cloud/SafetyRecoverySync.test.ts
          src/cloud/SafetyRecoverySyncPlanner.test.ts
          src/cloud/WorkoutTemplateSync.test.ts
          src/cloud/WorkoutTemplateSyncPlanner.test.ts
          src/cloud/TrainingProgramSync.test.ts
          src/cloud/TrainingProgramSyncPlanner.test.ts
          src/storage/WorkoutTemplateSyncMetadataStore.test.ts
          src/cloud/FoodEntrySync.test.ts
          src/repositories/FoodEntrySyncingRepository.test.ts
          src/cloud/MealTemplateSyncPlanner.test.ts
          src/cloud/MealTemplateRemoteSync.test.ts
          src/cloud/NutritionTargetSync.test.ts
          src/repositories/NutritionTargetSyncingRepository.test.ts
          src/storage/AsyncStorageOperationQueueStore.concurrent.test.ts
          src/storage/SyncConflictStore.test.ts
          > contract-tests.log 2>&1

      - name: Upload contract test log
        if: failure() && steps.contract-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-contract-test-log
          path: contract-tests.log
          if-no-files-found: error
          retention-days: 3

      - name: Full regression suite
        id: regressions
        run: npm test > regression-tests.log 2>&1

      - name: Upload regression test log
        if: failure() && steps.regressions.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-regression-test-log
          path: regression-tests.log
          if-no-files-found: error
          retention-days: 3

      - name: Expo export
        run: npx expo export --clear

      - name: Expo Doctor
        run: npx expo-doctor
