name: Apply P6 auth scenario roadmap sync

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p6-auth-smoke-roadmap
          fetch-depth: 0
      - name: Synchronize canonical roadmaps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          backend_head = '2d2ae0aca373ce471ade00c9e721b3c3f2557643'
          backend_merge = '15c1a939df06d84a38525f1558a2fa7a4ae2754f'
          mobile_main = '287afe06ddc893a7b52d1b7db4ca04cef272e46f'

          implementation_path = Path('docs/implementation-plan.md')
          implementation = implementation_path.read_text()
          baseline_start = 'Before this documentation synchronization slice:\n\n'
          baseline_end = 'Always re-check exact `main` and open pull requests in both repositories before starting another slice.'
          start = implementation.index(baseline_start) + len(baseline_start)
          end = implementation.index(baseline_end)
          implementation = implementation[:start] + f'''- mobile `main`: `{mobile_main}`;
          - backend `main`: `{backend_merge}`;
          - backend PR #119 exact green head: `{backend_head}`;
          - backend PR #119 merge: `{backend_merge}`;
          - open mobile pull requests before this documentation slice: none;
          - open backend pull requests after PR #119 merge: none;
          - public media uploads, real provider-backed media processing, and password-reset delivery remain disabled;
          - no provider account, credential, deployment, worker schedule, DNS mutation, native build, or production activation is implied by source completion.

          ''' + implementation[end:]

          marker = '- PR #118, exact green head `b91cd1feef7b3ff494e86ba133ac95037fbea677`, merge `64c04872e0ede26f87dd6017877e15ab218bccc1`: fail-closed staging smoke-runner foundation with strict disabled-capability verification and privacy-safe evidence.\n'
          if implementation.count(marker) != 1:
              raise SystemExit('Expected one implementation PR #118 marker')
          implementation = implementation.replace(
              marker,
              marker + f'- PR #119, exact green head `{backend_head}`, merge `{backend_merge}`: secret-safe synthetic auth/session scenario with replay cleanup and privacy-safe evidence.\n',
              1,
          )

          section_start = '### Active P6 slice — authenticated staging scenario contracts'
          section_end = 'Remaining P6 work after the authenticated-scenario slice:'
          start = implementation.index(section_start)
          end = implementation.index(section_end)
          section = f'''### Completed P6 slice — synthetic auth/session scenario

          Backend PR #119, exact green head `{backend_head}`, merge `{backend_merge}`, added:

          - an exact-confirmation synthetic auth/session scenario over released `/v1/auth/register`, `/login`, `/me`, `/refresh`, and `/account` contracts;
          - strict synthetic-fixture scoping for email local part and device name before any request;
          - in-memory-only email, password, access token, refresh token, user ID, device ID, session ID, and parsed auth responses;
          - controlled replay cleanup: register `409` may continue only through successful login with the same synthetic credentials;
          - strict user/device/session relationship validation before and after refresh;
          - synthetic account deletion followed by `401` verification for the refreshed access token;
          - bounded response reads, no redirects, no automatic retry, and fixed privacy-safe evidence categories;
          - deterministic coverage for new account, interrupted-run replay, refresh, cleanup, revocation, malformed responses, identity mismatch, invalid confirmation, non-synthetic identity rejection, unexpected status, and transport redaction;
          - an explicit source-only boundary: no standalone CLI, real staging execution, email delivery, media upload, deployment, or activation.

          The exact PR #119 head passed lint, formatting, TypeScript build, production configuration validation, migrations and idempotency, migrated-schema integration, PostgreSQL Social API integration, the complete Vitest suite, and production startup/health. Both new hand-written TypeScript files remain below 500 physical lines.

          ### Active P6 slice — managed-media staging scenario contracts

          Next source work:

          - compose the auth scenario with the generic disabled-capability runner through one bounded, redacted CLI/evidence boundary;
          - add typed memory-only capture for access tokens, asset IDs, state versions, signed upload URL/headers, and immutable delivery descriptors;
          - call the released `POST /v1/social/media/uploads` contract with exact synthetic idempotency identity and strict response parsing;
          - transfer one approved synthetic media fixture through the returned signed `PUT` without storing URL, headers, object key, or media bytes in evidence;
          - complete the upload through the released asset route and poll bounded owner-visible state transitions;
          - validate processing/recovery observation, immutable delivery, exact deletion, stale-upload expiry, cleanup, and controlled replay/idempotency behavior;
          - require strict disabled-capability verification around every applicable pre-enablement scenario;
          - keep all tests offline and deterministic through injected API, upload, clock, and fixture transports;
          - keep real staging/provider execution, deployment, workers, credentials, DNS, native builds, and capability activation external.

          Password-reset delivery/expiry/replay/session-revocation scenario composition remains the next separate P6 slice after managed media.

          Remaining P6 work after the managed-media scenario slice:'''
          implementation = implementation[:start] + section + implementation[end + len(section_end):]
          implementation_path.write_text(implementation)

          roadmap_path = Path('docs/roadmap/provider-readiness.md')
          roadmap = roadmap_path.read_text()
          old_status = 'Status: active. Configuration, policy, sender/link association, rollout/rollback ordering, and the fail-closed staging smoke-runner foundation are source-complete. Authenticated scenario contracts are next.'
          new_status = 'Status: active. Configuration, policy, rollout/rollback ordering, the fail-closed runner, and the secret-safe synthetic auth/session scenario are source-complete. Managed-media scenario contracts are next.'
          if roadmap.count(old_status) != 1:
              raise SystemExit('Expected one provider P6 status line')
          roadmap = roadmap.replace(old_status, new_status, 1)

          roadmap_marker = '- backend PR #118 exact green head `b91cd1feef7b3ff494e86ba133ac95037fbea677`, merge `64c04872e0ede26f87dd6017877e15ab218bccc1`;\n'
          if roadmap.count(roadmap_marker) != 1:
              raise SystemExit('Expected one provider PR #118 marker')
          roadmap = roadmap.replace(
              roadmap_marker,
              roadmap_marker + f'- backend PR #119 exact green head `{backend_head}`, merge `{backend_merge}`;\n',
              1,
          )

          old_check = '- [ ] add authenticated scenario contracts for signed upload, processing, delivery, deletion, cleanup, replay, idempotency, and password reset using synthetic non-production fixtures;'
          new_check = '''- [x] add a secret-safe synthetic auth/session scenario with register-conflict replay cleanup, refresh, account deletion, and revoked-session verification;
          - [ ] add managed-media signed upload, processing, delivery, deletion, cleanup, replay, and idempotency scenarios using synthetic non-production fixtures;
          - [ ] add password-reset delivery, expiry, invalid/replayed token, password replacement, and session-revocation scenarios using approved non-production fixtures;'''
          if roadmap.count(old_check) != 1:
              raise SystemExit('Expected one authenticated scenarios checklist item')
          roadmap = roadmap.replace(old_check, new_check, 1)

          next_start = '### Next bounded slice — authenticated staging scenario contracts'
          next_end = '### Remaining P6 operational runbooks'
          start = roadmap.index(next_start)
          end = roadmap.index(next_end)
          next_section = f'''### Completed synthetic auth/session scenario

          Backend PR #119 exact green head `{backend_head}`, merge `{backend_merge}`, completed:

          - [x] exact staging plan confirmation before secret parsing or network access;
          - [x] synthetic-fixture-scoped email and device identity;
          - [x] released-route register, controlled existing-account login, `/me`, refresh, refreshed `/me`, account deletion, and revoked-session verification;
          - [x] strict bounded auth and `/me` response parsing;
          - [x] memory-only email, password, access/refresh tokens, and dynamic user/device/session identifiers;
          - [x] interrupted-run replay cleanup without treating register conflict as success;
          - [x] fixed evidence fields with no secrets, dynamic identifiers, request bodies, response bodies, or raw errors;
          - [x] deterministic offline tests included in the canonical `tests/**/*.test.ts` suite;
          - [x] explicit documentation that no standalone CLI or real staging execution is included yet.

          ### Next bounded slice — managed-media staging scenario contracts

          Required source behavior:

          - [ ] compose generic capability verification and synthetic authentication through one bounded execution/evidence contract;
          - [ ] strict memory-only capture of access token, asset ID, state version, signed upload URL/headers, and immutable public descriptor;
          - [ ] released `POST /v1/social/media/uploads` creation with exact synthetic idempotency and controlled replay;
          - [ ] bounded external signed `PUT` of one approved synthetic JPEG/PNG fixture without redirect or evidence leakage;
          - [ ] released upload-completion call and strict owner-asset parsing;
          - [ ] bounded polling over documented asset states with no unbounded wait or provider retry;
          - [ ] processing/recovery, immutable delivery, exact deletion, stale-upload expiry, cleanup, and replay/idempotency checks;
          - [ ] disabled-capability verification before and after applicable pre-enablement execution;
          - [ ] privacy-safe evidence containing no token, email, password, asset ID, signed URL, headers, object key, public URL, provider payload, OCR text, or media bytes;
          - [ ] deterministic no-network tests through injected API, upload, time, and fixture transports;
          - [ ] no invented route, production target, provider account mutation, deployment, worker scheduling, native build, or activation command.

          Password-reset scenario composition remains a separate subsequent P6 slice. Actual provider staging execution remains external and requires direct authorization.

          '''
          roadmap = roadmap[:start] + next_section + roadmap[end:]
          roadmap_path.write_text(roadmap)
          PY

          npx prettier --write docs/implementation-plan.md docs/roadmap/provider-readiness.md
          node scripts/check-repository-file-lines.mjs
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/implementation-plan.md docs/roadmap/provider-readiness.md .github/workflows/ci.yml
          git commit -m "docs: record secret-safe auth smoke scenario"
          git push
