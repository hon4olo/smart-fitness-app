name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository file line audit
        run: node scripts/check-repository-file-lines.mjs

      - name: Changed file line limit
        run: node scripts/check-changed-file-lines.mjs

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Full regression suite
        run: npm test

      - name: Smoke expanded model runner
        env:
          EXPECTED_MOBILE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SYNC_INTENT_PROPERTY_SEED_COUNT: '129'
          SYNC_INTENT_PROPERTY_EVIDENCE_PATH: expanded-model-smoke-evidence.json
        run: node scripts/run-expanded-sync-intent-model.mjs

      - name: Expo export
        run: npx expo export --clear

      - name: Expo Doctor
        run: npx expo-doctor
