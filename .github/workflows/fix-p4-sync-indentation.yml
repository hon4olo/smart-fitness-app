name: Fix P4 Roadmap Sync Indentation

on:
  push:
    branches: [agent/p4-source-complete-roadmap-sync]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/p4-source-complete-roadmap-sync
          fetch-depth: 0
      - name: Fix script indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/sync-p4-source-complete-roadmap.py')
          text = path.read_text()
          old = '''    marker_index = text.find(marker)
          if marker_index < 0:
              raise SystemExit(f"{label} PR109 evidence: marker not found")
          return (
              text[:marker_index]
              + addition
              + text[marker_index + len(marker) :]
          )
          '''
          # The previous one-time fixer lost indentation after the first line.
          broken = '''    marker_index = text.find(marker)
          if marker_index < 0:
              raise SystemExit(f"{label} PR109 evidence: marker not found")
          return (
              text[:marker_index]
              + addition
              + text[marker_index + len(marker) :]
          )
          '''
          if old in text:
              raise SystemExit('script indentation already correct')
          broken = '''    marker_index = text.find(marker)
          if marker_index < 0:
              raise SystemExit(f"{label} PR109 evidence: marker not found")
          return (
              text[:marker_index]
              + addition
              + text[marker_index + len(marker) :]
          )
          '''
          # Match the exact malformed physical lines without relying on dedent.
          malformed = """    marker_index = text.find(marker)
          if marker_index < 0:
              raise SystemExit(f\"{label} PR109 evidence: marker not found\")
          return (
              text[:marker_index]
              + addition
              + text[marker_index + len(marker) :]
          )
          """
          # Triple-quoted indentation is normalized below to the actual broken block.
          malformed = malformed.replace('\n          if ', '\nif ').replace('\n              raise ', '\n    raise ').replace('\n          return ', '\nreturn ').replace('\n              text', '\n    text').replace('\n              +', '\n    +').replace('\n          )', '\n)')
          corrected = """    marker_index = text.find(marker)
              if marker_index < 0:
                  raise SystemExit(f\"{label} PR109 evidence: marker not found\")
              return (
                  text[:marker_index]
                  + addition
                  + text[marker_index + len(marker) :]
              )
          """.replace('\n              if ', '\n    if ').replace('\n                  raise ', '\n        raise ').replace('\n              return ', '\n    return ').replace('\n                  text', '\n        text').replace('\n                  +', '\n        +').replace('\n              )', '\n    )')
          if text.count(malformed) != 1:
              raise SystemExit('expected malformed indentation block once')
          path.write_text(text.replace(malformed, corrected, 1))
          PY
      - name: Validate script syntax
        run: python -m py_compile scripts/sync-p4-source-complete-roadmap.py
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-p4-sync-indentation.yml
      - name: Commit fixed script
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/sync-p4-source-complete-roadmap.py .github/workflows/fix-p4-sync-indentation.yml
          git commit -m "fix: restore P4 roadmap sync indentation"
          git push origin HEAD:agent/p4-source-complete-roadmap-sync
