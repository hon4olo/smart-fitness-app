name: Apply remaining sync fix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-remaining-strict-sync-payloads'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-remaining-strict-sync-payloads
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic patch
        run: python .github/diagnostics/apply-remaining-sync-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Validate targeted repair
        run: |
          npx tsc --noEmit
          npx vitest run test/strict-sync-payload-compatibility.test.ts test/fitness-profile-sync-payload.test.ts

      - name: Remove temporary patch machinery
        run: |
          rm .github/diagnostics/apply-remaining-sync-fix.py
          rm .github/workflows/apply-remaining-sync-fix.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[ota] Repair remaining strict sync payloads"
          git push origin HEAD:agent/fix-remaining-strict-sync-payloads
