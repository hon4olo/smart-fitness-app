name: Apply active workout localization

on:
  push:
    branches:
      - localize-active-workout-finish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > /tmp/active.patch
          git apply --check /tmp/active.patch
          git apply /tmp/active.patch
          rm .github/workflows/apply-active-workout-localization.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: localize active workout and finish flow"
          git push origin HEAD:localize-active-workout-finish
