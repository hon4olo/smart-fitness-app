name: Temporary Sync Social Media Disposition Plan

on:
  push:
    branches:
      - agent/sync-social-media-disposition-docs

permissions:
  contents: write

jobs:
  sync-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sync-social-media-disposition-docs
      - name: Synchronize implementation plan
        run: python .github/scripts/temporary_sync_social_media_disposition_plan.py
      - name: Commit synchronized plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/implementation-plan.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: record Social media disposition"
          git push origin HEAD:agent/sync-social-media-disposition-docs
