name: Fix P4 Completion Roadmap Matcher

on:
  push:
    branches: [agent/p4-source-complete-roadmap-sync]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/p4-source-complete-roadmap-sync
          fetch-depth: 0
      - name: Fix baseline evidence insertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/sync-p4-source-complete-roadmap.py')
          text = path.read_text()
          old = '    return replace_once(text, marker, addition, f"{label} PR109 evidence")\n'
          new = '''    marker_index = text.find(marker)
          if marker_index < 0:
              raise SystemExit(f"{label} PR109 evidence: marker not found")
          return (
              text[:marker_index]
              + addition
              + text[marker_index + len(marker) :]
          )
          '''
          if text.count(old) != 1:
              raise SystemExit('expected baseline evidence return once')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-p4-source-roadmap-sync.yml
      - name: Commit fixed matcher
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/sync-p4-source-complete-roadmap.py .github/workflows/fix-p4-source-roadmap-sync.yml
          git commit -m "fix: target baseline P4 evidence insertion"
          git push origin HEAD:agent/p4-source-complete-roadmap-sync
