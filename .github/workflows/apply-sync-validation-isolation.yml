name: Apply sync validation isolation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/isolate-sync-validation-failures'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/isolate-sync-validation-failures
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic patch
        run: python scripts/apply-sync-validation-isolation.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Focused validation-isolation tests
        run: npx vitest run test/sync-push-validation-isolation.test.ts

      - name: Full regression suite
        run: npm test 2>&1 | tee sync-isolation-regression.log

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-isolation-regression-log
          path: sync-isolation-regression.log
          retention-days: 3

      - name: Expo export
        run: npx expo export --clear

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Diff validation
        run: git diff --check

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-sync-validation-isolation.py
          rm .github/workflows/apply-sync-validation-isolation.yml

      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[ota] Isolate sync validation failures"
          git push origin HEAD:agent/isolate-sync-validation-failures
