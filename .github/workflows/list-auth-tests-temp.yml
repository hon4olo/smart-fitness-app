name: Inspect mobile auth tests

on:
  push:
    branches: [agent/mobile-account-deletion]
    paths:
      - .github/workflows/list-auth-tests-temp.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-account-deletion
      - name: Build test inventory
        run: find src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort > auth-test-files.txt
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth-test-files.txt
          git commit -m "chore: inspect mobile test inventory"
          git push origin HEAD:agent/mobile-account-deletion
