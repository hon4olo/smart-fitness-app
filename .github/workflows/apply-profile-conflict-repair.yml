name: Apply profile conflict repair

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/auto-resolve-profile-conflict'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/auto-resolve-profile-conflict
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply repair
        run: python scripts/apply-profile-conflict-repair.py

      - name: Install dependencies
        run: npm ci

      - name: Repository file line audit
        run: npm run audit:lines

      - name: Changed file line limit
        run: npm run audit:changed-lines

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Focused conflict tests
        run: npx vitest run test/fitness-profile-conflict-resolution.test.ts

      - name: Full regression suite
        run: npm test

      - name: Expo export
        run: npx expo export --clear

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Diff validation
        run: git diff --check

      - name: Remove temporary repair machinery
        run: |
          rm scripts/apply-profile-conflict-repair.py
          rm .github/workflows/apply-profile-conflict-repair.yml

      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[ota] Auto-resolve fitness profile conflicts"
          git push origin HEAD:agent/auto-resolve-profile-conflict
