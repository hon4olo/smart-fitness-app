name: P5 Resend composition cleanup

on:
  push:
    branches:
      - agent/p5-resend-composition-roadmap-sync

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p5-resend-composition-roadmap-sync
      - name: Fix evidence and remove temporary files
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/implementation-plan.md')
          content = path.read_text()
          old = '44604b216bef723680fdd12f3a5d9d100bb70e3b``;'
          new = '44604b216bef723680fdd12f3a5d9d100bb70e3b`;'
          if content.count(old) != 1:
              raise SystemExit(f'expected one malformed baseline, found {content.count(old)}')
          path.write_text(content.replace(old, new, 1))
          PY
          rm -f \
            .github/p5-resend-composition-trigger \
            .github/workflows/p5-resend-composition-roadmap-sync.yml \
            .github/workflows/p5-resend-composition-roadmap-sync-fix.yml \
            .github/workflows/p5-resend-composition-roadmap-sync-valid.yml \
            .github/workflows/p5-resend-composition-roadmap-sync-valid2.yml \
            .github/workflows/p5-resend-composition-cleanup.yml
      - name: Commit final docs-only head
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: finalize Resend composition roadmap sync"
          git push origin HEAD:agent/p5-resend-composition-roadmap-sync
