name: Smart Fitness Release Gate

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Full 40-character mobile commit SHA
        required: true
        type: string
      backend_ref:
        description: Full 40-character backend commit SHA
        required: true
        type: string
  workflow_call:
    inputs:
      app_ref:
        description: Full 40-character mobile commit SHA
        required: true
        type: string
      backend_ref:
        description: Full 40-character backend commit SHA
        required: true
        type: string
    secrets:
      BACKEND_REPOSITORY_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  validate-refs:
    name: Validate immutable refs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require full commit SHAs
        shell: bash
        env:
          APP_REF: ${{ inputs.app_ref }}
          BACKEND_REF: ${{ inputs.backend_ref }}
        run: |
          sha_pattern='^[0-9a-fA-F]{40}$'
          if [[ ! "$APP_REF" =~ $sha_pattern ]]; then
            echo "app_ref must be a full 40-character commit SHA"
            exit 1
          fi
          if [[ ! "$BACKEND_REF" =~ $sha_pattern ]]; then
            echo "backend_ref must be a full 40-character commit SHA"
            exit 1
          fi

  mobile:
    name: Mobile release validation
    needs: validate-refs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.checked-sha.outputs.sha }}
    env:
      EXPO_PUBLIC_API_BASE_URL: https://release-gate.invalid
    steps:
      - name: Checkout mobile
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref }}
          path: mobile
          fetch-depth: 0

      - name: Verify checked-out mobile SHA
        id: checked-sha
        working-directory: mobile
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.app_ref }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          if [ "${actual_sha,,}" != "${EXPECTED_SHA,,}" ]; then
            echo "Mobile checkout mismatch: expected=$EXPECTED_SHA actual=$actual_sha"
            exit 1
          fi
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Audit repository file sizes
        working-directory: mobile
        run: node scripts/check-repository-file-lines.mjs

      - name: Validate TypeScript
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Run complete mobile test suite
        working-directory: mobile
        run: npm test

      - name: Validate Expo public configuration
        working-directory: mobile
        run: npx expo config --type public > expo-public-config.json

      - name: Export Expo application
        working-directory: mobile
        run: npx expo export --clear

      - name: Validate Expo dependencies and configuration
        working-directory: mobile
        run: npx expo-doctor

      - name: Upload Expo configuration on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-expo-config
          path: mobile/expo-public-config.json
          if-no-files-found: ignore
          retention-days: 3

  backend:
    name: Backend release validation
    needs: validate-refs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.checked-sha.outputs.sha }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smart_fitness_release_gate
          POSTGRES_USER: smart_fitness
          POSTGRES_PASSWORD: smart_fitness_release_gate_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_fitness -d smart_fitness_release_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: production
      PORT: 3000
      HOST: 127.0.0.1
      DATABASE_URL: postgresql://smart_fitness:smart_fitness_release_gate_password@127.0.0.1:5432/smart_fitness_release_gate
      AUTH_ACCESS_TOKEN_SECRET: release-gate-access-token-secret-at-least-32-characters
      AUTH_REFRESH_TOKEN_SECRET: release-gate-refresh-token-secret-at-least-32-characters
      CORS_ALLOWLIST: https://release-gate.invalid
      COACH_MODEL_ENABLED: 'false'
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: hon4olo/smart-fitness-backend
          ref: ${{ inputs.backend_ref }}
          path: backend
          fetch-depth: 0
          token: ${{ secrets.BACKEND_REPOSITORY_TOKEN || github.token }}
          persist-credentials: false

      - name: Verify checked-out backend SHA
        id: checked-sha
        working-directory: backend
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.backend_ref }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          if [ "${actual_sha,,}" != "${EXPECTED_SHA,,}" ]; then
            echo "Backend checkout mismatch: expected=$EXPECTED_SHA actual=$actual_sha"
            exit 1
          fi
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --include=dev

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Validate compiled production configuration
        working-directory: backend
        run: >-
          node --input-type=module -e
          "import('./dist/config/env.js').then(({loadEnv}) => {
            const value = loadEnv(process.env);
            if (value.NODE_ENV !== 'production' || value.COACH_MODEL_ENABLED !== false) process.exit(1);
          })"

      - name: Apply backend migrations
        working-directory: backend
        run: npm run db:migrate

      - name: Verify migration idempotency
        working-directory: backend
        run: npm run db:migrate

      - name: Validate migrated backend schema
        working-directory: backend
        run: >-
          npx vitest run tests/migration.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Run complete backend test suite
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: ''
          HOST: ''
          DATABASE_URL: ''
          AUTH_ACCESS_TOKEN_SECRET: ''
          AUTH_REFRESH_TOKEN_SECRET: ''
          CORS_ALLOWLIST: ''
          COACH_MODEL_ENABLED: ''
        run: npm test -- --maxWorkers=1 --no-file-parallelism

      - name: Start production server and verify health
        id: startup
        working-directory: backend
        shell: bash
        run: |
          npm run start:production > release-startup.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat release-startup.log
          exit 1

      - name: Upload backend startup log
        if: failure() && steps.startup.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-backend-startup-log
          path: backend/release-startup.log
          if-no-files-found: error
          retention-days: 3

  release-ready:
    name: Release ready
    runs-on: ubuntu-latest
    needs: [validate-refs, mobile, backend]
    if: always()
    steps:
      - name: Enforce all release checks
        env:
          REF_RESULT: ${{ needs.validate-refs.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          MOBILE_SHA: ${{ needs.mobile.outputs.sha }}
          BACKEND_SHA: ${{ needs.backend.outputs.sha }}
        run: |
          if [ "$REF_RESULT" != "success" ] || [ "$MOBILE_RESULT" != "success" ] || [ "$BACKEND_RESULT" != "success" ]; then
            echo "Release blocked: refs=$REF_RESULT mobile=$MOBILE_RESULT backend=$BACKEND_RESULT"
            exit 1
          fi
          echo "Release gate passed for mobile=$MOBILE_SHA backend=$BACKEND_SHA"
