name: Apply active workout localization from PR

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: localize-active-workout-finish
      - name: Install verified files
        shell: bash
        run: |
          cat .localization/chunks/00 .localization/chunks/01 .localization/chunks/02 .localization/chunks/03 .localization/chunks/04 .localization/chunks/05 | base64 --decode > /tmp/active-files.tar.gz
          printf '%s  %s\n' 'cbc56e48dd101a71055c4f2e9100e7c2c063c58efe6bac8fe078287969e77f57' '/tmp/active-files.tar.gz' | sha256sum --check
          tar -xzf /tmp/active-files.tar.gz
          rm -rf .localization
          rm .github/workflows/apply-active-workout-localization.yml
          rm .github/workflows/apply-active-workout-localization-pr.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: localize active workout and finish flow"
          git push origin HEAD:localize-active-workout-finish
