name: Apply active workout localization from PR

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: localize-active-workout-finish
      - name: Apply verified patch
        shell: bash
        run: |
          base64 --decode .localization/active-code.patch.b64 | gzip --decompress > /tmp/active.patch
          set +e
          git apply --3way /tmp/active.patch > .localization/apply.log 2>&1
          APPLY_STATUS=$?
          set -e
          if [ "$APPLY_STATUS" -ne 0 ]; then
            printf '\n--- git status ---\n' >> .localization/apply.log
            git status --short >> .localization/apply.log
            git reset --hard HEAD
            git clean -fd --exclude=.localization/apply.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .localization/apply.log
            git commit -m "chore: record localization patch conflict"
            git push origin HEAD:localize-active-workout-finish
            exit 1
          fi
          rm .localization/active-code.patch.b64
          rm .localization/apply.log
          rmdir .localization
          rm .github/workflows/apply-active-workout-localization.yml
          rm .github/workflows/apply-active-workout-localization-pr.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: localize active workout and finish flow"
          git push origin HEAD:localize-active-workout-finish
