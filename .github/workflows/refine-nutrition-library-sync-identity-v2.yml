name: Refine nutrition library sync identity v2

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'agent/fix-nutrition-library-sync-identity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply refined patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/patches/refine-nutrition-library-sync-identity.py')
          text = path.read_text().replace('if count != 1:', 'if count < 1:')
          path.write_text(text)
          PY
          python .github/patches/refine-nutrition-library-sync-identity.py

      - name: Install dependencies
        run: npm ci

      - name: Validate focused and existing nutrition sync tests
        run: |
          npx tsc --noEmit
          npx vitest run \
            src/cloud/CloudQueueHelpers.test.ts \
            src/cloud/NutritionLibrarySync.test.ts \
            src/cloud/NutritionLibrarySync.integration.test.ts \
            test/nutrition-library-sync-identity.test.ts \
            test/nutrition-library-sync-alias.test.ts \
            test/sync-acknowledged-keys.test.ts

      - name: Remove temporary patch machinery
        run: |
          rm .github/patches/refine-nutrition-library-sync-identity.py
          rm .github/workflows/refine-nutrition-library-sync-identity.yml
          rm .github/workflows/refine-nutrition-library-sync-identity-v2.yml

      - name: Commit refined repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "[ota] Preserve local nutrition library identity"
          git push origin HEAD:${{ github.head_ref }}
