name: Finalize Social S7.7 retention cleanup docs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'docs/social-s7-7-retention-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Patch roadmap checkpoint
        run: node scripts/finalize-social-s7-7-retention-cleanup.mjs

      - name: Format roadmap files
        run: npx prettier --write ROADMAP_PROGRESS.md docs/roadmap/social-network.md

      - name: Publish roadmap checkpoint
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: record Social S7.7 retention cleanup"
          git push origin HEAD:${{ github.head_ref }}
