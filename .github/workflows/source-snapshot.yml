name: Source Snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package source snapshot
        run: tar --exclude=.git -czf mobile-source-snapshot.tgz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mobile-source-snapshot
          path: mobile-source-snapshot.tgz
          if-no-files-found: error
          retention-days: 1
