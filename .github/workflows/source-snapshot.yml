name: Apply Localization Slice

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply validated localization patch
        run: |
          cat .github/localization-patch/part-* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/localization.patch
          git apply --index /tmp/localization.patch
          git rm -r .github/localization-patch
          git rm .github/workflows/source-snapshot.yml
          git diff --cached --check

      - name: Commit clean localization slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: localize settings and account surfaces"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
