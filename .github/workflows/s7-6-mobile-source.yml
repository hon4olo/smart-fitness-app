# Retry after updating all remaining workout-post DTO v2 fixtures.
name: Validate Social S7.6 mobile source

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/s7-6-mobile-source.yml

permissions:
  contents: write

jobs:
  validate-source:
    if: github.head_ref == 'agent/social-workout-post-image-s7-6'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/social-workout-post-image-s7-6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded source patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/api/social/api.ts')
          source = path.read_text()
          old = '''const buildWorkoutPostPayload = (
            input: CreateSocialWorkoutPostInput,
          ): CreateSocialWorkoutPostInput => ({
            sourceWorkoutSessionId: input.sourceWorkoutSessionId.trim(),
            idempotencyKey: input.idempotencyKey.trim(),
            share: { ...input.share },
            ...(input.caption !== undefined
              ? { caption: input.caption === null ? null : input.caption.trim() }
              : {}),
          });
          '''
          new = '''const buildWorkoutPostPayload = (
            input: CreateSocialWorkoutPostInput,
          ): CreateSocialWorkoutPostInput => {
            const payload: CreateSocialWorkoutPostInput = {
              sourceWorkoutSessionId: input.sourceWorkoutSessionId.trim(),
              idempotencyKey: input.idempotencyKey.trim(),
              share: { ...input.share },
              ...(input.caption !== undefined
                ? { caption: input.caption === null ? null : input.caption.trim() }
                : {}),
            };
            if (input.image) {
              const assetId = input.image.assetId.trim();
              if (
                input.image.schemaVersion !== 1 ||
                !assetId ||
                !Number.isSafeInteger(input.image.expectedStateVersion) ||
                input.image.expectedStateVersion < 1
              ) {
                throw new Error("Social workout post image input is invalid");
              }
              payload.image = {
                schemaVersion: 1,
                assetId,
                expectedStateVersion: input.image.expectedStateVersion,
              };
            }
            return payload;
          };
          '''
          if source.count(old) != 1:
              raise SystemExit('workout post payload target mismatch')
          path.write_text(source.replace(old, new))

          test_path = Path('src/api/social/api.test.ts')
          test = test_path.read_text()
          old_fixture = '''      schemaVersion: 1,
                id: "00000000-0000-4000-8000-000000000001",
                author: profile,
                caption: "Training day",
                workout: { schemaVersion: 1, title: "Upper body" },
                createdAt: "2026-07-31T09:00:00.000Z",
          '''
          new_fixture = '''      schemaVersion: 2,
                id: "00000000-0000-4000-8000-000000000001",
                author: profile,
                caption: "Training day",
                workout: { schemaVersion: 1, title: "Upper body" },
                image: null,
                createdAt: "2026-07-31T09:00:00.000Z",
          '''
          if test.count(old_fixture) != 1:
              raise SystemExit('following feed fixture target mismatch')
          test_path.write_text(test.replace(old_fixture, new_fixture))
          PY
      - name: Format changed source
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx')
          files+=(src/api/social/api.ts src/api/social/api.test.ts)
          npx prettier --write "${files[@]}"
      - name: Validate source
        shell: bash
        run: |
          npx tsc --noEmit
          npm test
      - name: Publish validated source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src
          git diff --cached --check
          git commit -m 'feat: add managed workout post image flow'
          git push origin HEAD:agent/social-workout-post-image-s7-6
