name: Repair sync retry fixture

on:
  push:
    branches:
      - agent/sync-retry-backoff

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sync-retry-backoff
      - name: Repair fixture and clean up
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          content = path.read_text()
          old = "code: 'server_error', message: 'server failed', status: 503"
          new = "code: 'unavailable', message: 'server failed', status: 503"
          if content.count(old) != 1:
              raise SystemExit(f'Expected one fixture literal, found {content.count(old)}')
          path.write_text(content.replace(old, new, 1))
          PY
          rm .github/workflows/repair-sync-retry-fixture.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml .github/workflows/repair-sync-retry-fixture.yml
          git commit -m "test: use supported unavailable error code"
          git push
