name: Apply fitness profile sync fix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-fitness-profile-sync-payload'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic patch
        run: python3 .github/scripts/apply-fitness-profile-sync-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Validate targeted repair
        run: |
          npx tsc --noEmit
          npx vitest run test/fitness-profile-sync-payload.test.ts
          git diff --check

      - name: Remove temporary patch machinery
        run: |
          rm .github/scripts/apply-fitness-profile-sync-fix.py
          rm .github/workflows/apply-fitness-profile-sync-fix.yml

      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "[ota] Repair blocked fitness profile sync queue"
          git push origin HEAD:${{ github.head_ref }}
