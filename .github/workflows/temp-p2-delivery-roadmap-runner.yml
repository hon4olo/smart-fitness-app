name: Temporary P2 Delivery Roadmap Runner

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Repair and synchronize canonical P2 sections
        shell: python
        run: |
          from pathlib import Path
          import re

          mobile_main = '7695b3ff1116fae667e0dbbfd1f11baa9ae4d455'
          backend_main = '34104bec69533fbe89bbaa53cef0884119c13e38'
          p2_head = '565d60f99cf20cac7fb7c3bf0dcef01d737048ca'
          p2_merge = backend_main

          def replace_once(text, before, after, label):
              if before not in text:
                  raise SystemExit(f'{label}: marker not found')
              return text.replace(before, after, 1)

          def replace_section(text, start, end, lines, label):
              pattern = re.compile(re.escape(start) + r'.*?(?=' + re.escape(end) + r')', re.S)
              replacement = '\n'.join(lines).rstrip() + '\n\n'
              updated, count = pattern.subn(lambda _match: replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{label}: expected one section, found {count}')
              return updated

          baseline_before = (
              '- mobile `main`: `cf2250ac2d1806914fd8c01da417a527c01064c0`;\n'
              '- backend `main`: `b6fe1fa4d7f42960f0e0544f256466faa3cf9b49`;'
          )
          baseline_after = (
              f'- mobile `main`: `{mobile_main}`;\n'
              f'- backend `main`: `{backend_main}`;'
          )
          prior_evidence = '- backend PR #96 merge: `b6fe1fa4d7f42960f0e0544f256466faa3cf9b49`;\n'
          new_evidence = (
              prior_evidence
              + f'- backend PR #98 exact green head: `{p2_head}`;\n'
              + f'- backend PR #98 merge: `{p2_merge}`;\n'
          )

          roadmap_path = Path('ROADMAP_PROGRESS.md')
          roadmap = roadmap_path.read_text()
          roadmap = replace_once(roadmap, baseline_before, baseline_after, 'roadmap baseline')
          roadmap = replace_once(roadmap, prior_evidence, new_evidence, 'roadmap evidence')
          roadmap = replace_section(
              roadmap,
              '### P2 — worker entrypoints and orchestration',
              '### P3 — classifier and OCR readiness',
              [
                  '### P2 — worker entrypoints and orchestration',
                  '',
                  'Status: active. Shared runtime, cleanup, and derivative-delivery process boundaries are merged; moderation and operational orchestration remain incomplete.',
                  '',
                  'Backend PR #96, exact green head `6ec65413b4c3164bcf176d41230d817e203b8095`, merge `b6fe1fa4d7f42960f0e0544f256466faa3cf9b49`:',
                  '',
                  '- added the shared bounded one-shot and continuous worker runtime;',
                  '- added privacy-safe aggregate summaries, deterministic exit codes, abortable idle polling, and process resource cleanup;',
                  '- added the source-only managed-media cleanup entrypoint around existing claims, leases, legal holds, dependency ordering, and append-only audit;',
                  '- kept workers unscheduled and product capabilities disabled.',
                  '',
                  f'Backend PR #98, exact green head `{p2_head}`, merge `{p2_merge}`:',
                  '',
                  '- added a reusable per-claim batch boundary that checks abort before every next claimed operation;',
                  '- hardened cleanup shutdown so no new cleanup claim starts after `SIGINT` or `SIGTERM` is observed;',
                  '- added source-only derivative-delivery `process` and expired-claim `recover` operations;',
                  '- reused existing delivery ownership, state versions, processing tokens, leases, moderation-master integrity, immutable publication, stale-worker rejection, partial-publication cleanup, and recovery contracts;',
                  '- added bounded one-shot and continuous execution, privacy-safe aggregate output, readiness failure, resource-close, and regression coverage;',
                  '- accepted no owner IDs, asset IDs, object keys, processing tokens, state versions, prefixes, URLs, or provider payloads from CLI input.',
                  '',
                  'Remaining P2 boundary:',
                  '',
                  '- media-moderation processing and expired-claim recovery entrypoints;',
                  '- bounded upload-expiry and retryable-failure entrypoints where existing repositories expose safe claims;',
                  '- shared failure classification, safe retry backoff, maximum-attempt policy, and heartbeat only where measured operation duration requires it;',
                  '- privacy-safe aggregate readiness across all worker types;',
                  '- systemd unit/timer and Docker Compose templates plus process ordering, duplicate-process, crash-recovery, rollout, rollback, and emergency-disable runbooks;',
                  '- no worker deployment, scheduling, environment activation, or product enablement during source implementation.',
              ],
              'roadmap P2',
          )
          prompt_lines = [
              '> Continue autonomous work on the Smart Fitness Provider and Release Readiness program. Repositories: mobile `hon4olo/smart-fitness-app`, backend `hon4olo/smart-fitness-backend`. Do not rely only on this prompt: first verify exact current `main` and open PRs in both repositories; read both `AGENTS.md`, mobile `PROJECT_LEARNINGS.md`, `ROADMAP_PROGRESS.md`, `docs/implementation-plan.md`, `docs/roadmap/provider-readiness.md`, `docs/roadmap/social-network.md`, `docs/architecture/app-context-consumer-inventory.md`, and backend `docs/architecture/social-media-worker-runtime.md`; then inspect only code and tests relevant to the selected bounded slice. P0 and P1 are complete. P2 is active: backend PR #96 merged the shared runtime and cleanup process, and backend PR #98 exact green head `565d60f99cf20cac7fb7c3bf0dcef01d737048ca`, merge `34104bec69533fbe89bbaa53cef0884119c13e38`, added per-claim shutdown plus derivative-delivery processing and expired-claim recovery. Continue with the smallest complete media-moderation processing/recovery entrypoint using existing provider runtime, normalization, classifier, OCR, text-policy, claim-token, lease, state-version, stale-worker, cleanup, and audit contracts. Preserve all lifecycle, ownership, CAS, moderation, review, appeal, evidence, retention, legal-hold, cleanup, authentication, sync, idempotency, localization, offline, navigation, draft, polling, and privacy boundaries. Work through meaningful bounded backend/mobile/docs PRs, run full blocking CI, inspect review threads, and merge only exact fully green heads. Do not configure credentials, call real providers, create buckets/CDN/DNS, deploy backend changes, execute migrations outside CI, schedule workers, activate staging or production, publish OTA/EAS, create/install native builds, enable public media uploads, or activate production password-reset email without my direct request.'
          ]
          roadmap, prompt_count = re.subn(
              r'> Continue autonomous work on the Smart Fitness Provider and Release Readiness program\.[\s\S]*$',
              '\n'.join(prompt_lines),
              roadmap,
              count=1,
          )
          if prompt_count != 1:
              raise SystemExit('roadmap prompt: expected one match')
          roadmap_path.write_text(roadmap)

          implementation_path = Path('docs/implementation-plan.md')
          implementation = implementation_path.read_text()
          implementation = replace_once(implementation, baseline_before, baseline_after, 'implementation baseline')
          implementation = replace_once(implementation, prior_evidence, new_evidence, 'implementation evidence')
          implementation = replace_section(
              implementation,
              '## Current P2 status',
              '## Execution rules',
              [
                  '## Current P2 status',
                  '',
                  'P2 is active. The shared runtime, cleanup worker, per-claim shutdown boundary, and derivative-delivery process/recovery entrypoint are merged.',
                  '',
                  'Backend PR #96, exact green head `6ec65413b4c3164bcf176d41230d817e203b8095`, merge `b6fe1fa4d7f42960f0e0544f256466faa3cf9b49`:',
                  '',
                  '- added the provider-neutral bounded one-shot and continuous process loop;',
                  '- added the source-only cleanup worker around existing cleanup claims and providers;',
                  '- added deterministic aggregate output, exit codes, abortable polling, resource close, and privacy tests.',
                  '',
                  f'Backend PR #98, exact green head `{p2_head}`, merge `{p2_merge}`:',
                  '',
                  '- added `runWorkerClaimBatch`, which processes existing service claims one at a time and observes abort before the next claim;',
                  '- hardened cleanup so shutdown is observed between individual cleanup claims;',
                  '- added derivative-delivery `process` and expired-processing `recover` operations through the existing delivery worker;',
                  '- preserved exact state versions, processing tokens, leases, master integrity, immutable variants, stale-worker rejection, partial-publication cleanup, claim release, recovery, approval completion, and origin-cleanup ordering;',
                  '- added bounded one-shot/continuous modes, readiness failure, privacy-safe aggregate output, resource cleanup, and deterministic tests;',
                  '- added no scheduling, deployment, provider activation, credentials, or lifecycle changes.',
                  '',
                  '## Next bounded slice',
                  '',
                  'Continue P2 with the media-moderation process boundary:',
                  '',
                  '- audit the current moderation worker factory dependencies: private storage, image normalizer, classifier, OCR, text moderator, cleanup service, repositories, and provider runtime;',
                  '- add bounded `process` and expired-claim `recover` operations using the merged shared runtime and per-claim batch helper;',
                  '- preserve normalization, checksum validation, classifier/OCR attempt metadata, deterministic fitness-aware policy, manual-review routing, stale-result cleanup, claim release, state versions, and legal/retention boundaries;',
                  '- expose only aggregate process results and bounded failure categories without asset IDs, object keys, media bytes, OCR text, provider payloads, credentials, or raw exceptions;',
                  '- keep provider-specific adapters unavailable until P3 provider selection and keep every worker unscheduled.',
                  '',
                  'No deployment, migration execution outside CI, worker scheduling, environment activation, credential change, real provider call, public upload activation, OTA, or native build is authorized.',
              ],
              'implementation P2',
          )
          implementation_path.write_text(implementation)

          provider_path = Path('docs/roadmap/provider-readiness.md')
          provider = provider_path.read_text()
          provider = replace_once(provider, baseline_before, baseline_after, 'provider baseline')
          provider = replace_once(provider, prior_evidence, new_evidence, 'provider evidence')
          provider = replace_section(
              provider,
              '## Phase P2 — production worker entrypoints and orchestration',
              '## Phase P3 — classifier, OCR, and provider transport readiness',
              [
                  '## Phase P2 — production worker entrypoints and orchestration',
                  '',
                  'Status: active. Cleanup and derivative-delivery process boundaries are merged; moderation and operational templates remain incomplete.',
                  '',
                  'Merged evidence:',
                  '',
                  '- backend PR #96 exact green head: `6ec65413b4c3164bcf176d41230d817e203b8095`;',
                  '- backend PR #96 merge: `b6fe1fa4d7f42960f0e0544f256466faa3cf9b49`;',
                  f'- backend PR #98 exact green head: `{p2_head}`;',
                  f'- backend PR #98 merge: `{p2_merge}`;',
                  '- both exact heads passed lint, formatting, TypeScript build, production configuration validation, migrations and idempotency, migrated-schema integration, PostgreSQL Social API integration, full Vitest, and production startup/health.',
                  '',
                  'Shared process runtime:',
                  '',
                  '- [x] add bounded one-shot and continuous execution modes without changing domain claims or leases;',
                  '- [x] validate batch size, poll interval, optional maximum iterations, processed counts, and per-claim `0|1` results;',
                  '- [x] poll only after idle work and continue immediately after a non-empty iteration;',
                  '- [x] support abortable idle waits, `SIGINT`, `SIGTERM`, deterministic aggregate summaries, and deterministic exit codes;',
                  '- [x] close process resources in `finally` and keep raw exceptions out of direct process output;',
                  '- [x] observe graceful shutdown between individual claimed operations through the shared per-claim batch helper;',
                  '- [ ] add shared bounded failure classification, retry backoff, maximum attempts, and heartbeat only where required by measured operation duration.',
                  '',
                  'Managed-media cleanup entrypoint:',
                  '',
                  '- [x] compose the existing cleanup service and repositories with configured private storage and immutable delivery providers;',
                  '- [x] preserve oldest-due claims, claim tokens, lease expiry, exact state versions, legal holds, stale release, dependency ordering, tombstone purge, append-only audit, and idempotent provider deletion;',
                  '- [x] process cleanup operations one claim at a time and stop before the next claim after abort;',
                  '- [x] keep one-shot and continuous modes source-only and unscheduled.',
                  '',
                  'Derivative-delivery entrypoint:',
                  '',
                  '- [x] add bounded ready-asset processing through `processReadyBatch(1)`;',
                  '- [x] add bounded expired-processing recovery through `recoverExpiredProcessing(1)`;',
                  '- [x] preserve ownership, state versions, processing tokens, leases, master integrity, strict derivative generation, immutable publication, stale-worker rejection, partial cleanup, release, recovery, approval completion, and private-origin cleanup ordering;',
                  '- [x] accept no IDs, object keys, tokens, prefixes, URLs, or provider payloads from CLI input;',
                  '- [x] expose only versioned aggregate worker, operation, mode, stop-reason, iteration, processed, idle, and duration fields.',
                  '',
                  'Remaining worker entrypoints:',
                  '',
                  '- [ ] add bounded media-moderation processing and expired-claim recovery entrypoints;',
                  '- [ ] add bounded expired-upload and retryable-failure entrypoints where current repositories expose safe claim contracts;',
                  '- [ ] preserve provider attempt metadata, fail-closed moderation policy, manual-review routing, stale-worker cleanup, and exact state-version behavior;',
                  '- [ ] expose privacy-safe aggregate readiness and operation status across worker types.',
                  '',
                  'Process templates and operations:',
                  '',
                  '- [ ] add systemd unit and timer templates plus Docker Compose service templates;',
                  '- [ ] document process ordering, duplicate-process behavior, crash recovery, rollout, rollback, and emergency disable procedures;',
                  '- [ ] do not start or schedule workers in any environment during source implementation.',
                  '',
                  'No credential, provider account, real provider call, bucket, CDN, DNS, deployment, migration execution outside CI, worker scheduling, public upload activation, or production environment change was performed.',
              ],
              'provider P2',
          )
          provider_path.write_text(provider)
      - name: Commit exact documentation repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP_PROGRESS.md docs/implementation-plan.md docs/roadmap/provider-readiness.md
          git commit -m "docs: record P2 delivery worker slice"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
