name: Patch Social S6 roadmap

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-social-s6-roadmap.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/social-s6-roadmap-sync
      - name: Patch roadmap
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/roadmap/social-network.md')
          text = path.read_text()
          replacements = {
              'Updated: 2026-07-31': 'Updated: 2026-08-01',
              'Status: architecture approved; implementation not started.\n\nThe moderation pipeline follows': 'Status: text-only Phase S6 is source-complete; production provider activation remains disabled.\n\nThe moderation pipeline follows',
              '- [ ] define versioned moderation categories, reason codes, policy versions, confidence bands, and terminal decisions;': '- [x] define versioned moderation categories, reason codes, policy versions, confidence bands, and terminal decisions;',
              '- [ ] introduce a backend-only `ContentModerationProvider` abstraction separate from `StructuredModelClient` and Coach contracts;': '- [x] introduce a backend-only `ContentModerationProvider` abstraction separate from `StructuredModelClient` and Coach contracts;',
              '- [ ] permit reuse only of low-level provider transport, retry, timeout, telemetry, and configuration plumbing where dependency direction remains clean;': '- [x] permit reuse only of low-level provider transport, retry, timeout, telemetry, and configuration plumbing where dependency direction remains clean;',
              '- [ ] ensure routes contain no provider prompts, provider payloads, policy thresholds, or orchestration logic;': '- [x] ensure routes contain no provider prompts, provider payloads, policy thresholds, or orchestration logic;',
              '- [ ] validate every provider result through strict versioned Zod contracts and reject unknown critical fields;': '- [x] validate every provider result through strict versioned Zod contracts and reject unknown critical fields;',
              '- [ ] persist structured category results, hashes, policy/model identifiers, attempts, latency, and bounded failure metadata without chain-of-thought or raw provider responses;': '- [x] persist structured category results, hashes, policy/model identifiers, attempts, latency, and bounded failure metadata without chain-of-thought or raw provider responses;',
              '- [ ] use idempotent moderation runs and content hashes so retries cannot publish duplicate or stale content;': '- [x] use idempotent moderation runs and content hashes so retries cannot publish duplicate or stale content;',
              '- [ ] keep the backend as the only caller of moderation providers and keep credentials server-side.': '- [x] keep the backend as the only caller of moderation providers and keep credentials server-side.',
              '- [ ] normalize Unicode, confusable characters, hidden characters, stretched words, whitespace, links, repeated spam, and obvious prohibited terms before model classification;': '- [x] normalize Unicode, confusable characters, hidden characters, stretched words, whitespace, links, repeated spam, and obvious prohibited terms before model classification;',
              '- [ ] use deterministic reserved/prohibited-term checks for usernames and use model classification only where context is materially useful;': '- [x] use deterministic reserved/prohibited-term checks for usernames and use model classification only where context is materially useful;',
              '- [ ] define categories for explicit sexual content, nudity, possible minor safety, graphic violence, hate, harassment, self-harm, personal data/doxxing, spam/scams, and dangerous fitness or medical claims;': '- [x] define categories for explicit sexual content, nudity, possible minor safety, graphic violence, hate, harassment, self-harm, personal data/doxxing, spam/scams, and dangerous fitness or medical claims;',
              '- [ ] make the model return typed signals only; the deterministic policy worker owns `allow`, `review_required`, and `reject`;': '- [x] make the model return typed signals only; the deterministic policy worker owns `allow`, `review_required`, and `reject`;',
              '- [ ] prohibit provider output from overriding hard policy rules or existing block/restriction enforcement;': '- [x] prohibit provider output from overriding hard policy rules or existing block/restriction enforcement;',
              '- [ ] keep false-positive-sensitive cases in `review_required` rather than silently deleting them.': '- [x] keep false-positive-sensitive cases in `review_required` rather than silently deleting them.',
              '- [ ] moderate workout-post captions synchronously before publication;': '- [x] moderate workout-post captions synchronously before publication;',
              '- [ ] moderate comments synchronously before insertion or notification creation;': '- [x] moderate comments synchronously before insertion or notification creation;',
              '- [ ] moderate display-name and bio revisions before replacing the currently approved profile version;': '- [x] moderate display-name and bio revisions before replacing the currently approved profile version;',
              '- [ ] preserve the currently approved profile when a submitted revision is pending, rejected, or the provider is unavailable;': '- [x] preserve the currently approved profile when a submitted revision is pending, rejected, or the provider is unavailable;',
              '- [ ] return stable localized errors for rejected, review-required, unavailable, timed-out, and retryable moderation states;': '- [x] return stable localized errors for rejected, review-required, unavailable, timed-out, and retryable moderation states;',
              '- [ ] add exact ownership, idempotency, stale-result, provider-failure, unknown-field, policy-threshold, and account-deletion tests.': '- [x] add exact ownership, idempotency, stale-result, provider-failure, unknown-field, policy-threshold, and account-deletion tests.',
              '19. [ ] S6 policy/categories/contracts, provider boundary, persistence, and deterministic decision worker.': '19. [x] S6 policy/categories/contracts, provider boundary, persistence, and deterministic decision worker.',
              '20. [ ] S6 synchronous moderation for captions, comments, display names, and bios.': '20. [x] S6 synchronous moderation for captions, comments, display names, and bios.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected roadmap text: {old}')
              text = text.replace(old, new, 1)

          marker = '- provider activation, model selection, and production thresholds require explicit environment configuration and staging validation.\n'
          note = ('- provider activation, model selection, and production thresholds require explicit environment configuration and staging validation.\n'
                  '- source completion does not activate a production provider; enforcement and provider selection remain safe-default disabled until explicit staging and production configuration.\n'
                  '- `review_required` is a typed non-public terminal result in S6; it does not create or action an S5 report and has no pending-profile UI model.\n')
          if marker not in text:
              raise SystemExit('missing S6 rollout marker')
          text = text.replace(marker, note, 1)
          path.write_text(text)
      - name: Commit roadmap
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/roadmap/social-network.md
          git commit -m "docs: mark Social S6 source-complete"
          git push origin HEAD:docs/social-s6-roadmap-sync
