name: Refine nutrition library sync identity v4

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'agent/fix-nutrition-library-sync-identity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply tolerant refined patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/patches/refine-nutrition-library-sync-identity.py')
          text = path.read_text()
          start = text.index('def replace_once')
          end = text.index('\n\n# Preserve local semantic IDs')
          helper = '''def replace_once(path: str, old: str, new: str) -> None:\n    target = Path(path)\n    text = target.read_text()\n    count = text.count(old)\n    if count < 1:\n        print(f"SKIP {path}: missing replacement")\n        return\n    print(f"APPLY {path}: {count} match(es)")\n    target.write_text(text.replace(old, new, 1))\n'''
          path.write_text(text[:start] + helper + text[end:])
          PY
          python .github/patches/refine-nutrition-library-sync-identity.py | tee patch-output.log

      - name: Install dependencies
        run: npm ci

      - name: Validate refined repair
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '=== TYPECHECK ==='
            npx tsc --noEmit
            echo '=== TESTS ==='
            npx vitest run \
              src/cloud/CloudQueueHelpers.test.ts \
              src/cloud/NutritionLibrarySync.test.ts \
              src/cloud/NutritionLibrarySync.integration.test.ts \
              test/nutrition-library-sync-identity.test.ts \
              test/nutrition-library-sync-alias.test.ts \
              test/sync-acknowledged-keys.test.ts
          } 2>&1 | tee refined-validation.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refined-nutrition-sync-validation
          path: |
            patch-output.log
            refined-validation.log
          if-no-files-found: error
          retention-days: 3

      - name: Require validation success
        if: steps.validate.outcome != 'success'
        run: exit 1

      - name: Remove temporary patch machinery
        run: |
          rm .github/patches/refine-nutrition-library-sync-identity.py
          rm .github/workflows/refine-nutrition-library-sync-identity.yml
          rm .github/workflows/refine-nutrition-library-sync-identity-v2.yml
          rm .github/workflows/refine-nutrition-library-sync-identity-v3.yml
          rm .github/workflows/refine-nutrition-library-sync-identity-v4.yml
          rm patch-output.log refined-validation.log

      - name: Commit refined repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "[ota] Preserve local nutrition library identity"
          git push origin HEAD:${{ github.head_ref }}
