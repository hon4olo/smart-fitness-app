name: Diagnose production sync

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'diagnostic/production-sync-smoke'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exercise production auth and sync
        env:
          API_BASE_URL: https://api.peptonio.com
        run: node .github/scripts/diagnose-production-sync.mjs

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-sync-diagnostic
          path: production-sync-diagnostic.json
          if-no-files-found: error
          retention-days: 3
