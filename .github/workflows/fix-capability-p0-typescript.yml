name: Temporary Capability P0 Type Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Restore boolean return
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/context/AppContext.tsx')
          content = path.read_text()
          before = """      setState((currentState) => {
        const nextState = upsertUserLimitationInState(currentState, normalized);
        scheduleStateMutation({ label: 'Apply synchronized data', nextState });
        return nextState;
      });
    },
    [scheduleStateMutation],
  );
"""
          after = """      setState((currentState) => {
        const nextState = upsertUserLimitationInState(currentState, normalized);
        scheduleStateMutation({ label: 'Apply synchronized data', nextState });
        return nextState;
      });
      return true;
    },
    [scheduleStateMutation],
  );
"""
          if before not in content:
              raise SystemExit('Expected AppContext block not found')
          path.write_text(content.replace(before, after, 1))

      - name: Commit exact fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/AppContext.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: restore limitation mutation result"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
