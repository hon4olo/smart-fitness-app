name: Apply stale sync idempotency repair

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/repair-stale-sync-idempotency'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/repair-stale-sync-idempotency
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic repair
        run: |
          python scripts/apply-stale-sync-idempotency-repair.py
          python scripts/fix-partial-push-test-type.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee stale-sync-repair-tsc.log

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stale-sync-repair-tsc-log
          path: stale-sync-repair-tsc.log
          retention-days: 3

      - name: Focused synchronization tests
        run: >-
          npx vitest run
          test/sync-push-validation-isolation.test.ts
          test/sync-stale-idempotency-repair.test.ts
          test/sync-failure-diagnostic.test.ts
          test/sync-coordinator.test.ts

      - name: Full regression suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee stale-sync-repair-regression.log

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stale-sync-repair-regression-log
          path: stale-sync-repair-regression.log
          retention-days: 3

      - name: Expo export
        run: npx expo export --clear

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Diff validation
        run: git diff --check

      - name: Remove temporary repair machinery
        run: |
          rm scripts/apply-stale-sync-idempotency-repair.py
          rm scripts/fix-partial-push-test-type.py
          rm .github/workflows/apply-stale-sync-idempotency-repair.yml
          rm -f stale-sync-repair-tsc.log stale-sync-repair-regression.log

      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[ota] Repair stale sync idempotency keys"
          git push origin HEAD:agent/repair-stale-sync-idempotency
