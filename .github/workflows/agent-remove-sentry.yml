name: Agent remove Sentry integration

on:
  push:
    branches:
      - agent/remove-sentry-and-align-roadmap

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-sentry-and-align-roadmap
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove Sentry and align release documentation
        shell: bash
        run: |
          python <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('.')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text())
          package.get('dependencies', {}).pop('@sentry/react-native', None)
          package.get('scripts', {}).pop('sentry:upload-sourcemaps', None)
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          app_path = root / 'app.json'
          app = json.loads(app_path.read_text())
          plugins = app['expo'].get('plugins', [])
          app['expo']['plugins'] = [
              plugin for plugin in plugins
              if plugin != '@sentry/react-native/expo'
          ]
          app_path.write_text(json.dumps(app, indent=2) + '\n')

          (root / 'metro.config.js').write_text(
              "const { getDefaultConfig } = require('expo/metro-config');\n\n"
              "module.exports = getDefaultConfig(__dirname);\n"
          )

          layout_path = root / 'src/app/_layout.tsx'
          layout = layout_path.read_text()
          layout = layout.replace(
              "import { CrashReportContextBridge } from '@/observability/CrashReportContextBridge';\n",
              '',
          )
          layout = re.sub(
              r"import \{\n  initializeCrashReporting,\n  wrapRootComponent,\n\} from '@/observability/crashReporting';\n",
              '',
              layout,
          )
          layout = layout.replace('\ninitializeCrashReporting();\n', '\n')
          layout = layout.replace('        <CrashReportContextBridge />\n', '')
          layout = layout.replace(
              'export default wrapRootComponent(RootLayout);',
              'export default RootLayout;',
          )
          layout_path.write_text(layout)

          fallback_path = root / 'src/observability/RootErrorFallback.tsx'
          fallback_path.write_text("""import * as Updates from 'expo-updates';
import { useState } from 'react';
import {
  ActivityIndicator,
  Pressable,
  StyleSheet,
  Text,
  View,
} from 'react-native';

type RootErrorFallbackProps = {
  error: Error;
  retry(): void;
};

export function RootErrorFallback({ retry }: RootErrorFallbackProps) {
  const [restarting, setRestarting] = useState(false);

  const restart = async () => {
    if (restarting) return;
    setRestarting(true);
    try {
      await Updates.reloadAsync();
    } catch {
      setRestarting(false);
      retry();
    }
  };

  return (
    <View accessibilityRole="alert" style={styles.screen}>
      <View style={styles.card}>
        <Text selectable style={styles.eyebrow}>SMART FITNESS</Text>
        <Text selectable style={styles.title}>Something went wrong</Text>
        <Text selectable style={styles.body}>
          Your saved data has not been intentionally removed. Try reopening this screen or restart the app.
        </Text>
        <Pressable
          accessibilityRole="button"
          disabled={restarting}
          onPress={retry}
          style={({ pressed }) => [styles.primaryButton, pressed && styles.buttonPressed]}>
          <Text style={styles.primaryButtonText}>Try again</Text>
        </Pressable>
        <Pressable
          accessibilityRole="button"
          disabled={restarting}
          onPress={() => void restart()}
          style={({ pressed }) => [styles.secondaryButton, pressed && styles.buttonPressed]}>
          {restarting ? (
            <ActivityIndicator color="#FFFFFF" />
          ) : (
            <Text style={styles.secondaryButtonText}>Restart app</Text>
          )}
        </Pressable>
      </View>
    </View>
  );
}

const styles = StyleSheet.create({
  screen: {
    alignItems: 'center',
    backgroundColor: '#000000',
    flex: 1,
    justifyContent: 'center',
    paddingHorizontal: 24,
    paddingVertical: 48,
  },
  card: {
    backgroundColor: '#111111',
    borderColor: '#282828',
    borderRadius: 24,
    borderWidth: 1,
    maxWidth: 460,
    padding: 24,
    width: '100%',
  },
  eyebrow: {
    color: '#8E8E93',
    fontSize: 12,
    fontWeight: '700',
    letterSpacing: 1.1,
    marginBottom: 12,
  },
  title: {
    color: '#FFFFFF',
    fontSize: 28,
    fontWeight: '700',
    letterSpacing: -0.4,
    lineHeight: 34,
  },
  body: {
    color: '#B0B0B5',
    fontSize: 16,
    lineHeight: 24,
    marginBottom: 20,
    marginTop: 12,
  },
  primaryButton: {
    alignItems: 'center',
    backgroundColor: '#0A84FF',
    borderRadius: 14,
    justifyContent: 'center',
    minHeight: 50,
    paddingHorizontal: 18,
  },
  primaryButtonText: {
    color: '#FFFFFF',
    fontSize: 16,
    fontWeight: '700',
  },
  secondaryButton: {
    alignItems: 'center',
    borderColor: '#3A3A3C',
    borderRadius: 14,
    borderWidth: 1,
    justifyContent: 'center',
    marginTop: 10,
    minHeight: 50,
    paddingHorizontal: 18,
  },
  secondaryButtonText: {
    color: '#FFFFFF',
    fontSize: 16,
    fontWeight: '600',
  },
  buttonPressed: {
    opacity: 0.72,
  },
});
""")

          for path in [
              root / 'src/observability/CrashReportContextBridge.tsx',
              root / 'src/observability/crashReporting.ts',
              root / 'src/observability/crashReportingModel.ts',
              root / 'src/observability/crashReportingModel.test.ts',
              root / 'docs/release/crash-reporting.md',
              root / 'ios/sentry.properties',
              root / 'android/sentry.properties',
          ]:
              if path.exists():
                  path.unlink()

          ota_path = root / '.github/workflows/eas-update.yml'
          ota = ota_path.read_text()
          ota = ota.replace("      SENTRY_DISABLE_AUTO_UPLOAD: 'true'\n", '')
          ota = ota.replace("      EXPECTED_RUNTIME_VERSION: '1.0.2'", "      EXPECTED_RUNTIME_VERSION: '1.0.3'")
          ota_path.write_text(ota)

          roadmap_path = root / 'ROADMAP_PROGRESS.md'
          roadmap = roadmap_path.read_text()
          roadmap = roadmap.replace('- Privacy-safe crash-reporting source foundation complete.\n', '')
          roadmap = roadmap.replace(
              '4. Configure Sentry/EAS values, select a compatible runtime, and verify source maps on preview devices.\n',
              '4. Complete the remaining release-device and offline-restart matrix on the working standalone runtime.\n',
          )
          roadmap_path.write_text(roadmap)

          release_path = root / 'docs/roadmap/release-and-account.md'
          release = release_path.read_text()
          release = release.replace('Updated: 2026-07-25', 'Updated: 2026-07-30')
          release = release.replace(
              '- privacy-safe Sentry integration, source-map wiring, Expo Doctor, and root error recovery are complete in mobile PR #96;\n',
              '- root error recovery and privacy-safe local diagnostics remain available without a third-party crash-reporting SDK;\n',
          )
          release = release.replace('- configure Sentry and EAS environment values;\n', '')
          release = release.replace(
              '- select a new runtime/app version and create matching iOS and Android builds;\n',
              '- the standalone iOS runtime 1.0.3 is working; create and validate the matching Android build;\n',
          )
          release = release.replace('- verify native and EAS Update source maps with sanitized test events;\n', '')
          release = release.replace(
              '- complete auth-refresh and API failure-category instrumentation without raw payloads.\n',
              '- complete privacy-safe local auth-refresh and API failure-category diagnostics without raw payloads.\n',
          )
          release_path.write_text(release)

          quality_path = root / 'docs/roadmap/data-quality-and-scale.md'
          quality = quality_path.read_text().replace(
              'and Sentry runtime stability;',
              'and standalone runtime stability;',
          )
          quality_path.write_text(quality)
          PY

          npm install

      - name: Validate mobile project
        run: |
          npx tsc --noEmit
          npm test
          npx expo-doctor
          npx expo export --clear

      - name: Verify Sentry is fully absent
        shell: bash
        run: |
          rm .github/workflows/agent-remove-sentry.yml
          if git grep -ni sentry -- . ':!PROJECT_LEARNINGS.md'; then
            echo 'Sentry references remain in tracked files.' >&2
            exit 1
          fi

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: remove Sentry integration'
          git push origin HEAD:agent/remove-sentry-and-align-roadmap
