name: Agent remove Sentry integration

on:
  push:
    branches:
      - agent/remove-sentry-and-align-roadmap
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'agent/remove-sentry-and-align-roadmap')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'agent/remove-sentry-and-align-roadmap' }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove Sentry and align Expo patches
        run: |
          node scripts/agent-remove-sentry.mjs
          npm install

      - name: Validate mobile project
        run: |
          npx tsc --noEmit
          npm test
          npx expo-doctor
          npx expo export --clear

      - name: Verify removal and clean temporary automation
        shell: bash
        run: |
          rm .github/workflows/agent-remove-sentry.yml
          rm scripts/agent-remove-sentry.mjs
          if git grep -nEi '(^|[^A-Za-z])sentry([^A-Za-z]|$)' -- . ':!PROJECT_LEARNINGS.md'; then
            echo 'Sentry references remain in tracked files.' >&2
            exit 1
          fi

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: remove Sentry integration'
          git push origin HEAD:${{ github.head_ref || 'agent/remove-sentry-and-align-roadmap' }}
