name: Sync P3 Rekognition Roadmap

on:
  push:
    branches:
      - agent/p3-rekognition-roadmap-sync

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.actor != 'github-actions[bot]' ||
      !contains(github.event.head_commit.message, 'docs: record Rekognition classifier contract')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p3-rekognition-roadmap-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 .github/scripts/sync-p3-rekognition-roadmap.py
      - run: >-
          npx prettier --write
          ROADMAP_PROGRESS.md
          docs/implementation-plan.md
          docs/roadmap/provider-readiness.md
      - name: Commit synchronized roadmap
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP_PROGRESS.md
          git add docs/implementation-plan.md
          git add docs/roadmap/provider-readiness.md
          git commit -m "docs: record Rekognition classifier contract"
          git push origin HEAD:agent/p3-rekognition-roadmap-sync
