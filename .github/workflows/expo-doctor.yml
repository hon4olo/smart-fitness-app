name: Expo Doctor

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - app.json
      - eas.json
      - metro.config.js
      - package.json
      - package-lock.json
      - .github/workflows/expo-doctor.yml
  push:
    branches: [main]
    paths:
      - app.json
      - eas.json
      - metro.config.js
      - package.json
      - package-lock.json
      - .github/workflows/expo-doctor.yml

permissions:
  contents: read

concurrency:
  group: expo-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor
