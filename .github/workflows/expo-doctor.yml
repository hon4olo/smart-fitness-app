name: Expo Doctor

on:
  pull_request:
    branches: [main]
    paths:
      - app.json
      - eas.json
      - metro.config.js
      - package.json
      - package-lock.json
      - .github/workflows/expo-doctor.yml
  push:
    branches: [main]
    paths:
      - app.json
      - eas.json
      - metro.config.js
      - package.json
      - package-lock.json
      - .github/workflows/expo-doctor.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor
