name: Expo Doctor

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - app.json
      - eas.json
      - metro.config.js
      - package.json
      - package-lock.json
      - .github/workflows/expo-doctor.yml
  push:
    branches: [main]
    paths:
      - app.json
      - eas.json
      - metro.config.js
      - package.json
      - package-lock.json
      - .github/workflows/expo-doctor.yml

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, linux, x64, hermes-mobile-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Expo Doctor
        shell: bash
        run: |
          set -o pipefail
          npx expo-doctor 2>&1 | tee expo-doctor.log
      - name: Upload Expo Doctor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-doctor-log
          path: expo-doctor.log
          if-no-files-found: error
