name: Temporary Roadmap Sync 167

on:
  push:
    branches:
      - agent/p9-roadmap-sync-167

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/p9-roadmap-sync-167
          fetch-depth: 0

      - name: Apply exact documentation patch
        run: python scripts/temporary-roadmap-sync-167.py

      - name: Verify and commit when changed
        run: |
          if git diff --quiet; then
            echo 'Roadmap is already synchronized.'
            exit 0
          fi
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "docs/current-status.md docs/handoffs/latest.md docs/implementation-plan.md "
          grep -q 'Backend PR #167 adds the fifth ownership-safe' docs/implementation-plan.md
          grep -q 'five ownership-safe allowlisted projections exist' docs/implementation-plan.md
          grep -q 'backend `main`: `cbcecff4c0def1771bd91a67ff389ae517f48d8a`' docs/implementation-plan.md
          git config user.name hon4olo
          git config user.email 145094796+hon4olo@users.noreply.github.com
          git add docs/implementation-plan.md docs/current-status.md docs/handoffs/latest.md
          git commit -m 'docs: sync roadmap after backend PR 167'
          git push origin HEAD:agent/p9-roadmap-sync-167
