name: Apply Workouts Hub Localization

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/localize-workouts-hub'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/localize-workouts-hub
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply validated patch
        run: |
          cat .localization/workouts-hub-*.b64 | tr -d '\n\r ' | base64 --decode | gzip --decompress > /tmp/workouts-hub.patch
          test "$(sha256sum /tmp/workouts-hub.patch | cut -d' ' -f1)" = "94ae70666b925aeb591e540cc67e6a3786d73fedda455b3cdbd0543838c20e10"
          git apply --check /tmp/workouts-hub.patch
          git apply /tmp/workouts-hub.patch
          rm -rf .localization .github/workflows/apply-workouts-hub-localization.yml
      - name: Commit clean slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: localize Workouts hub"
          git push origin HEAD:agent/localize-workouts-hub
