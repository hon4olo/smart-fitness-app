name: P5 password reset completion roadmap

on:
  push:
    branches:
      - agent/p5-password-reset-completion-roadmap

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p5-password-reset-completion-roadmap
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record P5 source completion
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          def replace_section(text: str, start: str, end: str, replacement: str, label: str) -> str:
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f'{label}: start marker missing')
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f'{label}: end marker missing')
              return text[:start_index] + replacement.rstrip() + '\n\n' + text[end_index:]

          plan_path = Path('docs/implementation-plan.md')
          plan = plan_path.read_text()
          plan = replace_once(
              plan,
              '- mobile `main`: `cf3de6bd746493ffbf8d4d3159c302dadb6c5c30`;\n- backend `main`: `44604b216bef723680fdd12f3a5d9d100bb70e3b``;',
              '- mobile `main`: `ef048d41f47487fe079afb1b5ac4b49edea36d76`;\n- backend `main`: `44604b216bef723680fdd12f3a5d9d100bb70e3b`;',
              'implementation baseline',
          )
          evidence_anchor = '- backend PR #112 merge: `44604b216bef723680fdd12f3a5d9d100bb70e3b`;\n'
          evidence = evidence_anchor + '- mobile PR #382 exact green head: `ad25597ff91a947fb90964f2993ecb6f5e79487d`;\n- mobile PR #382 merge: `521f6202cf9782f299d14c4b3f92920d5c65d3cc`;\n- mobile PR #383 exact green head: `4e596dd3f6abd44284e0baf8509f19296c24178b`;\n- mobile PR #383 merge: `ef048d41f47487fe079afb1b5ac4b49edea36d76`;\n'
          plan = replace_once(plan, evidence_anchor, evidence, 'implementation evidence')
          plan_section = '''## P5 source completion

The password-reset product and delivery source boundary is complete across backend and mobile.

Existing invariants remain unchanged:

- generic accepted responses do not disclose account existence;
- hashed one-time tokens retain cooldown, expiry, replay rejection, undelivered-token invalidation, password replacement, and all-session revocation;
- provider credentials and readiness remain inert until the explicit password-reset product flag is enabled;
- tokens remain outside ordinary persisted application state, logs, diagnostics, analytics, and user-visible copy.

Backend PR #110, exact green head `54fe3bcf57745caddb1177ef6c75453befed407f`, merge `2c683c95274409aa5958033e96cb8acf67ca8b56`, completed the selected Resend request, bilingual template, exact trusted reset-link, strict parser, deterministic idempotency, and no-network contract boundary.

Backend PR #111, exact green head `1f0d08ff6eccec676c94bd231e974ad98cdd5176`, merge `ecd8a2e425b032be323b9852ba9e60221a1ca968`, completed the bounded Resend runtime, adapter-owned retry/failure mapping, stable request identity, strict success parsing, provider-message discard, final constant error, and token-invalidation preservation.

Backend PR #112, exact green head `ef779e42f6d28f4c8c103a4a2961d1ee8c26b436`, merge `44604b216bef723680fdd12f3a5d9d100bb70e3b`, completed explicit `resend` selection, strict backend-only configuration, application-root composition through the shared bounded transport, privacy-safe configured/ready state, capability gating, fail-closed production validation, and deterministic no-network coverage.

Mobile PR #383, exact green head `4e596dd3f6abd44284e0baf8509f19296c24178b`, merge `ef048d41f47487fe079afb1b5ac4b49edea36d76`, completed release-grade app/universal-link source preparation:

- added fail-closed dynamic Expo configuration using the shared `PASSWORD_RESET_APP_LINK_BASE_URL` setting;
- accepts only one exact HTTPS DNS-hosted `/auth/reset-password` route with no port, credentials, query, fragment, trailing slash, or broad path;
- adds narrowly scoped iOS associated-domain and Android verified app-link source configuration while preserving existing configuration and idempotence;
- enforces the backend-generated exact 43-character base64url token and rejects missing, duplicate, short, long, padded, or non-URL-safe values before any reset request;
- removes token material from navigation state after malformed input, terminal token rejection, or successful reset;
- preserves localized invalid-link recovery, capability gating, generic accepted responses, session cleanup, and forced return to sign-in;
- documents external AASA, `assetlinks.json`, owned-domain, signing-certificate, native-build, physical-device, and real-delivery gates;
- passed repository and changed-file line audits, TypeScript, Coach/sync contract tests, the full regression suite, Expo export, and Expo Doctor on the exact merged head.

P5 autonomous source preparation is complete. The next approved source phase is P6 deployment configuration, policies, smoke scripts, and runbooks.

Operational password reset remains unavailable until an authorized environment supplies a verified sender domain, Resend account and credential, exact owned HTTPS link domain, Apple and Android association files, backend deployment and migration execution, a new native build, real non-production delivery evidence, physical-device validation, and explicit capability enablement.

No credential, sender-domain, DNS, association-file deployment, provider account, real delivery, backend deployment, migration execution outside CI, environment activation, OTA/EAS publication, native build, device installation, or production capability activation was performed.
'''
          plan = replace_section(
              plan,
              '## P5 current source boundary',
              '## Execution rules',
              plan_section,
              'implementation P5 section',
          )
          plan_path.write_text(plan)

          roadmap_path = Path('docs/roadmap/provider-readiness.md')
          roadmap = roadmap_path.read_text()
          roadmap_section = '''## Phase P5 — password-reset product and delivery readiness

Status: source-complete. Backend token/session behavior, selected Resend contract/runtime/configuration/composition/readiness, localized mobile forgot/reset flow, and production app/universal-link source preparation are merged. Provider accounts, credentials, domains, association files, deployment, real delivery, native builds, physical-device validation, and activation remain external.

Merged evidence:

- backend PR #60 exact head: `af192c4fbe48c82f1d8e3ac5c7f020c294e9fe72f`;
- backend PR #60 merge: `5aa7fa35b0d3e89fe1e824266fd659d1296a61a3`;
- mobile PR #200 exact head: `5ff6cdb50fe04e35d7294d241f37ea46924c06c2`;
- mobile PR #200 merge: `1b77802bb765a1a3db6b8dcd1f081c210049a2d0`;
- backend PR #110 exact green head: `54fe3bcf57745caddb1177ef6c75453befed407f`;
- backend PR #110 merge: `2c683c95274409aa5958033e96cb8acf67ca8b56`;
- backend PR #111 exact green head: `1f0d08ff6eccec676c94bd231e974ad98cdd5176`;
- backend PR #111 merge: `ecd8a2e425b032be323b9852ba9e60221a1ca968`;
- backend PR #112 exact green head: `ef779e42f6d28f4c8c103a4a2961d1ee8c26b436`;
- backend PR #112 merge: `44604b216bef723680fdd12f3a5d9d100bb70e3b`;
- mobile PR #383 exact green head: `4e596dd3f6abd44284e0baf8509f19296c24178b`;
- mobile PR #383 merge: `ef048d41f47487fe079afb1b5ac4b49edea36d76`;
- the exact backend heads passed full Backend CI;
- the exact mobile PR #383 head passed repository and changed-file line audits, TypeScript, Coach/sync contracts, full regression, Expo export, and Expo Doctor.

Mobile:

- [x] add localized capability-gated `Forgot password` and `Reset password` source routes with strict API states;
- [x] preserve the generic accepted response so account existence is not disclosed;
- [x] retain strict password validation, invalid/expired-token handling, success state, session cleanup, and forced return to sign-in;
- [x] complete fail-closed production app/universal-link source configuration for the exact HTTPS reset route;
- [x] reject broad hosts/paths/schemes and duplicate, malformed, padded, short, or long token parameters before reset submission;
- [x] remove rejected or completed token material from navigation state and keep tokens out of ordinary persisted state, logs, diagnostics, analytics, and user-visible copy;
- [x] retain source-level accessibility labels, localized copy, strict request/response parser coverage, and deterministic link/token configuration tests;
- [ ] perform authorized native-build and physical-device deep-link validation after domain association and environment configuration exist.

Backend delivery:

- [x] preserve hashed one-time tokens, cooldown, expiry, replay rejection, undelivered-token invalidation, password replacement, and all-session revocation;
- [x] select and document Resend `POST /emails` as the concrete provider API contract;
- [x] add bounded EN/RU plain-text and HTML template source with expiry and security guidance;
- [x] construct links only from an exact trusted HTTPS application reset-route base;
- [x] add fixed bounded request construction, non-token idempotency identity, strict success parsing, and contract-level redaction tests;
- [x] add the production-shaped Resend runtime through the shared bounded provider HTTP transport;
- [x] add explicit bounded retry ownership and terminal/transient provider failure mapping;
- [x] compose the complete adapter in the backend application root behind the explicit `resend` selector;
- [x] update production validation and password-reset configured/ready state only for complete safe composition;
- [x] preserve token invalidation when final delivery fails;
- [x] retain password-reset capability gating in the backend contract and pre-auth mobile navigation.

P5 source completion does not constitute operational readiness. External activation requires:

- a Resend account, API key, verified sender identity/domain, and approved secret-store configuration;
- one owned HTTPS link domain configured identically in backend and mobile build environments;
- deployed Apple App Site Association and Android Digital Asset Links files scoped to `/auth/reset-password`;
- backend migration execution and deployment in an explicitly targeted non-production environment;
- a new native build carrying the associated-domain entitlement and verified intent filter;
- real non-production delivery, expiry, replay, invalidation, reauthentication, cold-start, warm-navigation, and physical-device evidence;
- explicit password-reset capability enablement only after those gates pass.

No provider account, credential, sender/domain, DNS, association-file deployment, real email, backend deployment, migration execution outside CI, OTA/EAS publication, native build/install, device validation, or activation was performed during source preparation.
'''
          roadmap = replace_section(
              roadmap,
              '## Phase P5 — password-reset product and delivery readiness',
              '## Phase P6 — deployment configuration, policies, and runbooks',
              roadmap_section,
              'provider roadmap P5 section',
          )
          roadmap = replace_once(
              roadmap,
              '1. P5 password-reset app/universal-link source and delivery readiness.\n2. P6 deployment policies, configuration templates, smoke scripts, and runbooks.\n3. P7 explicit sync conflict-choice contract.\n4. P8 diagnostics, fixed-SHA release gate, and Android source preparation.\n5. P9 technical privacy, legal, and analytics prerequisites.',
              '1. P6 deployment policies, configuration templates, smoke scripts, and runbooks.\n2. P7 explicit sync conflict-choice contract.\n3. P8 diagnostics, fixed-SHA release gate, and Android source preparation.\n4. P9 technical privacy, legal, and analytics prerequisites.',
              'provider roadmap execution order',
          )
          roadmap_path.write_text(roadmap)

          release_path = Path('docs/roadmap/release-and-account.md')
          release_path.write_text('''# Release and account roadmap

Updated: 2026-08-03

## Release readiness and observability

Status: source-code foundation complete; external configuration, deployment, native builds, and device validation remain.

Completed:

- backend production config, migrations, compiled startup, and `/health` are blocking in CI;
- rollout and rollback procedures are documented;
- root error recovery and privacy-safe local diagnostics remain available without a third-party crash-reporting SDK;
- account deletion, password change, session/device management, and password-reset source flows are complete;
- password-reset email delivery is source-prepared behind explicit configuration, readiness, and capability gating;
- iOS universal-link and Android app-link source configuration is fail-closed and scoped to the exact `/auth/reset-password` route.

Remaining:

- configure `BACKEND_REPOSITORY_TOKEN` and run the fixed-SHA cross-repository gate;
- create and validate the matching Android build;
- run staged preview/internal-production rollout and rollback rehearsal;
- run real-device smoke on small iPhone, standard iPhone, Android, offline restart, and a second device;
- complete privacy-safe local auth-refresh and API failure-category diagnostics without raw payloads;
- configure approved provider/domain infrastructure only in explicitly targeted environments.

## Account lifecycle

Completed:

- account deletion with current-password re-authentication and server-side cascade;
- fail-closed local cleanup marker and account-scoped cache/token/outbox/conflict cleanup;
- authenticated password change with all-session revocation;
- active sessions/devices screen;
- revoke one owned non-current session;
- revoke all other sessions while preserving the current session;
- backend password-reset token storage, generic non-disclosing request/reset routes, hashed one-time tokens, cooldown, expiry, replay rejection, undelivered-token invalidation, password replacement, and all-session revocation;
- selected Resend request/template/parser/runtime/configuration/composition/readiness source boundary;
- localized capability-gated mobile forgot/reset screens;
- exact HTTPS reset-route source configuration for iOS universal links and Android verified app links;
- exact 43-character base64url token parsing, duplicate rejection, and navigation-state cleanup.

Relevant merges:

- backend #48 `cf3a249b307a7493c68d5f6485e241a9af3b0272` and mobile #97 `475a55619cc03644de5423a8440fbf4b0019345e`: account deletion;
- backend #49 `dba333ab652e1f055fd954cb91040b19071fdd0c` and mobile #98 `e5a2b8d378f37cec1f6968c349d0b504d2760219`: password change;
- backend #50 `88df103237caf67052770c32c77d9ba092df3065` and mobile #99 `aa2a55bfe9cf006a27de087de398d01941fa1a05`: session/device management;
- backend #60 `5aa7fa35b0d3e89fe1e824266fd659d1296a61a3` and mobile #200 `1b77802bb765a1a3db6b8dcd1f081c210049a2d0`: provider-neutral password-reset foundation and localized mobile flow;
- backend #110 `2c683c95274409aa5958033e96cb8acf67ca8b56`, #111 `ecd8a2e425b032be323b9852ba9e60221a1ca968`, and #112 `44604b216bef723680fdd12f3a5d9d100bb70e3b`: Resend contract, runtime, configuration, composition, and readiness;
- mobile #383 `ef048d41f47487fe079afb1b5ac4b49edea36d76`: fail-closed universal/app-link source preparation and strict reset-token navigation.

Remaining:

- create the Resend account and credential and verify the approved sender domain;
- select and configure one owned HTTPS link domain identically for backend and native builds;
- deploy narrowly scoped Apple App Site Association and Android Digital Asset Links files;
- deploy the current backend migration and endpoints in an explicitly targeted environment;
- create a new native build containing the associated-domain entitlement and verified intent filter;
- validate real reset delivery, expiry, replay rejection, undelivered-token invalidation, reauthentication, cold/warm link routing, and session revocation on physical devices;
- validate destructive flows, cleanup retry, and re-registration on devices;
- add user-facing privacy explanation;
- add privacy-safe analytics only after event and consent contracts are approved;
- enable the password-reset capability only after all external gates pass.

Data export remains intentionally deferred.
''')
          PY
          npx prettier --write \
            docs/implementation-plan.md \
            docs/roadmap/provider-readiness.md \
            docs/roadmap/release-and-account.md
          rm -f .github/workflows/p5-password-reset-completion-roadmap.yml
      - name: Commit synchronized roadmap
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: record password reset source completion"
          git push origin HEAD:agent/p5-password-reset-completion-roadmap
