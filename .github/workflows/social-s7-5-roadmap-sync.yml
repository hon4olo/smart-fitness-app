name: Sync Social S7.5 roadmap

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/social-s7-5-roadmap-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'docs/social-s7-5-complete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/social-s7-5-complete
          fetch-depth: 0
      - name: Update canonical and focused roadmaps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap_path = Path('ROADMAP_PROGRESS.md')
          roadmap = roadmap_path.read_text()

          replacements = {
              "- mobile `main`: `ec8d987ffa839fcbd28b4f29f57029f3f0ea81ae`;\n- backend `main`: `918383fe832256f370668293b5264373c5239256`;": "- mobile `main`: `aa693a959a16b20c125c4358d31c2107624a5258`;\n- backend `main`: `86f773c92d682c5a42e090a00a7be8908e881c0b`;",
              "Status: backend S7.1-S7.4 source-complete and merged; S7.5 managed mobile avatars is the active slice.": "Status: backend S7.1-S7.5 and mobile S7.5 are source-complete and merged; S7.6 one-image workout posts is the active source-code slice.",
              """### S7.5 Mobile managed-avatar flow — active

Implement next:

- replace free-form avatar URL editing with managed selection, local preview, compression/upload progress, moderation status, retry, rejection, deletion, offline, and expired-session states;
- consume strict owner-state and approved public descriptor contracts; never treat a user-supplied URL as a managed asset;
- preserve the currently approved avatar while a replacement is uploading, processing, awaiting review, rejected, failed, or deleted;
- use bounded polling or explicit refresh rather than holding an upload request open through processing;
- review actual Expo SDK 56 compatibility before adding any native dependency;
- treat client preprocessing as UX optimization only; server validation remains authoritative;
- localize all new visible copy;
- do not create a native build without explicit authorization.
""": """### S7.5 Managed-avatar binding and mobile flow — source-complete

Merged backend PR #86:

- exact green head: `b51bd2deaff6bfc964e9d5e32f387049fd89d213`;
- merge SHA: `86f773c92d682c5a42e090a00a7be8908e881c0b`.

Completed backend contract:

- approved owner-scoped avatar assets can be bound to the authenticated Social profile only through asset ID and expected state version;
- arbitrary avatar URLs were removed from profile write contracts;
- public profile `avatarUrl` is a server-derived projection of the approved immutable managed variant;
- replacement, deletion, stale-state, ownership, report-evidence privacy, account cleanup, and owner-opaque public URL behavior are covered by PostgreSQL and full backend CI.

Merged mobile PR #353:

- exact green head: `2eadb498bbbf39ed2ed49e6635b5de16014a6de7`;
- merge SHA: `aa693a959a16b20c125c4358d31c2107624a5258`.

Completed mobile source flow:

- free-form avatar URL editing is removed from profile writes;
- strict owner-state and owner-opaque immutable public descriptor parsers fail closed;
- Expo SDK 56-compatible image selection, local preview, bounded JPEG preprocessing, signed PUT progress, completion, bounded polling, approved binding, refresh, retry, rejection, deletion, offline, expiry, stale-state, and expired-session states are implemented;
- the currently approved avatar remains public while a replacement is non-public;
- restart-safe account-scoped draft state persists only asset ID and local preview URI, never signed URLs, headers, tokens, or private payloads;
- all new visible copy is localized in English and Russian;
- line audits, TypeScript, contract tests, full regression, iOS/Android/Web Expo export, and Expo Doctor are green.

Activation boundary:

- no OTA/EAS publish, native build, device install, backend deployment, migration execution, credentials change, real storage/CDN/moderation-provider activation, or public media activation was performed;
- the new native Expo modules and config plugin require a future explicitly authorized native build and physical-device validation before runtime release claims.
""",
              """1. Implement S7.5 managed mobile avatars against the merged owner-state, upload, status, descriptor, retry, deletion, and cleanup contracts.
2. Implement S7.6 the bounded one-image workout-post flow after managed avatars are stable.
3. Define and implement manual review/appeal and retention operations.
4. Run staging calibration, physical-device, release, rollback, privacy, and legal gates only with the required authorization and configuration.
""": """1. Implement S7.6 the bounded one-image workout-post flow against the merged managed-media lifecycle.
2. Define and implement manual review/appeal and retention operations.
3. Run staging calibration, physical-device, release, rollback, privacy, and legal gates only with the required authorization and configuration.
""",
              """> Continue the Smart Fitness roadmap from `ROADMAP_PROGRESS.md`, with Social S7.5 managed mobile avatars as the active source-code slice. Work autonomously through meaningful bounded slices instead of stopping after micro-changes. At the start, verify exact `main` and open PRs for `hon4olo/smart-fitness-app` and `hon4olo/smart-fitness-backend`; read both `AGENTS.md`, mobile `PROJECT_LEARNINGS.md`, `ROADMAP_PROGRESS.md`, `docs/roadmap/social-network.md`, and only the files relevant to the current slice. Do not restart already completed Social S0-S7.4 work. Replace free-form avatar URL editing with the merged managed-media owner and public descriptor contracts; support selection, local preview, bounded UX-only preprocessing, upload progress, processing/moderation status, retry, rejection, deletion, offline, and expired-session states. Preserve the private-data versus Social boundary, existing routes/contracts, localization, block/restriction enforcement, and file-size limits. Verify Expo SDK 56 compatibility before any native dependency and do not add dependencies without approval. Run full blocking CI, inspect review threads, and merge only exact green heads. Do not publish OTA, create/install native builds, deploy backend changes, execute migrations, activate staging/production, configure credentials, connect real storage/CDN/moderation providers, or enable public image uploads without explicit authorization.
""": """> Continue the Smart Fitness roadmap from `ROADMAP_PROGRESS.md`, with Social S7.6 bounded one-image workout posts as the active source-code slice. Work autonomously through meaningful bounded slices instead of stopping after micro-changes. At the start, verify exact `main` and open PRs for `hon4olo/smart-fitness-app` and `hon4olo/smart-fitness-backend`; read both `AGENTS.md`, mobile `PROJECT_LEARNINGS.md`, `ROADMAP_PROGRESS.md`, `docs/roadmap/social-network.md`, and only the files relevant to the current slice. Do not restart already completed Social S0-S7.5 work. Reuse the merged managed-media asset lifecycle, strict owner/public descriptors, signed private upload, bounded status polling, deletion, cleanup, and moderation states. Add at most one image to a workout post, keep the private completed workout separate from its immutable public snapshot, keep non-approved assets out of public DTOs and notifications, preserve existing share controls and explicit final publication confirmation, localize all new states, and keep client preprocessing UX-only. Run full blocking CI, inspect review threads, and merge only exact green heads. Do not publish OTA, create/install native builds, deploy backend changes, execute migrations, activate staging/production, configure credentials, connect real storage/CDN/moderation providers, or enable public image uploads without explicit authorization.
""",
          }

          for old, new in replacements.items():
              count = roadmap.count(old)
              if count != 1:
                  raise SystemExit(f'ROADMAP replacement count {count} for: {old[:80]!r}')
              roadmap = roadmap.replace(old, new)
          roadmap_path.write_text(roadmap)

          social_path = Path('docs/roadmap/social-network.md')
          social = social_path.read_text()
          social_replacements = {
              "Updated: 2026-08-01": "Updated: 2026-08-02",
              "Status: architecture approved; implementation not started.": "Status: S7.1-S7.5 are source-complete and merged; S7.6 bounded one-image workout posts is the active source-code slice. Production media activation remains disabled.",
              "Arbitrary remote `avatarUrl` values are transitional and must not be treated as a secure long-term media contract. User media must move to server-owned asset IDs and immutable approved variants.": "Arbitrary remote `avatarUrl` write inputs have been removed. Public avatar URLs are server-derived from approved server-owned asset IDs and immutable variants. The remaining source-code scope is the bounded one-image workout-post flow and later operator/release gates.",
          }
          for old, new in social_replacements.items():
              count = social.count(old)
              if count != 1:
                  raise SystemExit(f'Social roadmap replacement count {count} for: {old[:80]!r}')
              social = social.replace(old, new)
          social_path.write_text(social)
          PY
      - name: Validate roadmap state
        shell: bash
        run: |
          grep -Fq 'S7.5 Managed-avatar binding and mobile flow — source-complete' ROADMAP_PROGRESS.md
          grep -Fq 'S7.6 one-image workout posts is the active source-code slice' ROADMAP_PROGRESS.md
          grep -Fq 'aa693a959a16b20c125c4358d31c2107624a5258' ROADMAP_PROGRESS.md
          grep -Fq '86f773c92d682c5a42e090a00a7be8908e881c0b' ROADMAP_PROGRESS.md
          grep -Fq 'S7.1-S7.5 are source-complete and merged' docs/roadmap/social-network.md
          ! grep -Fq 'S7.5 managed mobile avatars is the active slice' ROADMAP_PROGRESS.md
      - name: Publish docs-only commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/social-s7-5-roadmap-sync.yml
          git add -- ROADMAP_PROGRESS.md docs/roadmap/social-network.md
          git diff --cached --check
          git commit -m 'docs: complete Social S7.5 roadmap'
          git push origin HEAD:docs/social-s7-5-complete
