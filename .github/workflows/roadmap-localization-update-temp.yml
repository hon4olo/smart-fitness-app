name: Apply localization roadmap status

on:
  push:
    branches: [agent/localization-settings-foundation]
    paths:
      - .github/workflows/roadmap-localization-update-temp.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/localization-settings-foundation
      - name: Update roadmap
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ROADMAP_PROGRESS.md')
          text = path.read_text()
          text = text.replace(
              "Status: account-deletion source implementation complete in backend PR `#48` (merge `cf3a249b307a7493c68d5f6485e241a9af3b0272`) and mobile PR `#97`; production backend deployment and real-device validation remain external.",
              "Status: account deletion, authenticated password change, and session/device management are complete at source-code level. Production backend deployment, reset-password delivery infrastructure, and real-device validation remain external.",
          )
          text = text.replace("- [ ] add authenticated password change with session re-verification;", "- [x] add authenticated password change with session re-verification;")
          text = text.replace("- [ ] add a sessions/devices screen with last-seen metadata;", "- [x] add a sessions/devices screen with last-seen metadata;")
          text = text.replace("- [ ] allow revoking one session and all other sessions;", "- [x] allow revoking one session and all other sessions;")
          text = text.replace(
              "- [x] prevent interrupted cleanup from restoring stale data by persisting and resuming a local cleanup marker before AppState/session restoration;",
              "- [x] prevent interrupted cleanup from restoring stale data by persisting and resuming a local cleanup marker before AppState/session restoration;\n- [x] rotate a password only after current-password verification and revoke all existing sessions;\n- [x] list active devices with current-session and last-seen metadata;\n- [x] revoke one owned non-current session or all other sessions while preserving the current session;\n- backend PR `#49`, merge `dba333ab652e1f055fd954cb91040b19071fdd0c`, and mobile PR `#98`, merge `e5a2b8d378f37cec1f6968c349d0b504d2760219`: authenticated password change;\n- backend PR `#50`, merge `88df103237caf67052770c32c77d9ba092df3065`, and mobile PR `#99`, merge `aa2a55bfe9cf006a27de087de398d01941fa1a05`: devices and sessions management;",
          )
          text = text.replace("- [ ] introduce a typed localization layer with stable message keys and namespace ownership by feature;", "- [x] introduce a typed localization layer with stable message keys and namespace ownership by feature;")
          text = text.replace("- [ ] add device-language detection and an explicit in-app language override;", "- [x] add device-language detection and an explicit in-app language override;")
          text = text.replace("- [ ] prevent translated strings from being used as persisted identifiers, enum values, route parameters, or sync contract fields;", "- [x] prevent translated strings from being used as persisted identifiers, enum values, route parameters, or sync contract fields;")
          text = text.replace(
              "Priority: P1, begin before hardcoded copy expands further.\n\n- [x] introduce",
              "Priority: P1, begin before hardcoded copy expands further.\n\nStatus: typed English/Russian foundation, English fallback, device detection, persisted override, and localized root/tab/settings navigation are complete in mobile PR `#100`; full-screen translation, units, pluralization, accessibility, and screenshot validation remain.\n\n- [x] introduce",
          )
          text = text.replace("- [ ] General: language, appearance, and regional/unit preferences;", "- [ ] General: language and appearance are complete; regional and unit preferences remain;")
          text = text.replace("- [ ] Appearance: System, Light, and Dark modes using the existing theme provider;", "- [x] Appearance: System, Light, and Dark modes using the existing theme provider;")
          text = text.replace("- [ ] persist preferences account-scoped where they should follow the user and device-scoped where they are device behavior;", "- [ ] persist account-scoped preferences where they should follow the user; language and appearance are already device-scoped;")
          text = text.replace("- [ ] define migration/default behavior for existing installs;", "- [x] define safe system-language and system-appearance defaults for existing installs;")
          text = text.replace("- [ ] apply setting changes immediately without requiring restart where technically safe;", "- [x] apply language and appearance changes immediately without requiring restart;")
          text = text.replace("- [ ] keep unavailable settings out of the UI instead of showing disabled placeholders.", "- [x] keep unavailable settings out of the UI instead of showing disabled placeholders.")
          text = text.replace(
              "Create a dedicated Settings surface rather than continuing to overload Profile.",
              "Create a dedicated Settings surface rather than continuing to overload Profile. The initial functional surface is complete in mobile PR `#100`; remaining sections are intentionally hidden until implemented.",
          )
          path.write_text(text)
          PY
      - name: Commit roadmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP_PROGRESS.md
          git commit -m "docs: update account localization and settings roadmap"
          git push origin HEAD:agent/localization-settings-foundation
