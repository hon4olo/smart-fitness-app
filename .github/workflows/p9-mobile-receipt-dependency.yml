name: P9 Mobile Receipt Dependency

on:
  push:
    branches:
      - agent/p9-mobile-account-deletion-receipts

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/p9-mobile-account-deletion-receipts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install compatible Expo crypto package
        run: npx expo install expo-crypto --npm

      - name: Commit dependency files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "build: add Expo crypto for deletion receipts"
          git push origin HEAD:agent/p9-mobile-account-deletion-receipts
