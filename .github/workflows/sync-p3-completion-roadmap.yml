name: Sync P3 Completion Roadmap

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/p3-composition-roadmap-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/p3-composition-roadmap-sync
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize roadmap files
        run: python scripts/sync-rekognition-composition-roadmap.py

      - name: Format roadmap files
        run: >-
          npx prettier --write
          ROADMAP_PROGRESS.md
          docs/implementation-plan.md
          docs/roadmap/provider-readiness.md

      - name: Remove temporary infrastructure
        run: |
          rm scripts/sync-rekognition-composition-roadmap.py
          rm .github/workflows/sync-p3-completion-roadmap.yml

      - name: Commit clean documentation head
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: record P3 provider readiness completion"
          git push origin HEAD:agent/p3-composition-roadmap-sync
