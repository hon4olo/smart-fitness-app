name: Temporary P1 Roadmap Sync

on:
  push:
    branches:
      - agent/p1-private-storage-roadmap-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-private-storage-roadmap-sync
      - name: Update canonical P1 status
        shell: python
        run: |
          from pathlib import Path
          import re

          mobile_main = 'e69185cb3a61f2c802a6c87ca33f8c168e1beb79'
          backend_main = 'a2d4f67db3000785facb11e2d69cacb8cda03bc3'
          p1_head = 'f0a199ac4c797d6b025fb48226502a7edddcab9e'
          p1_merge = backend_main

          def replace_once(text, before, after, label):
              if text.count(before) != 1:
                  raise SystemExit(f'{label}: expected one match, found {text.count(before)}')
              return text.replace(before, after, 1)

          def replace_section(text, start, end, replacement, label):
              pattern = re.compile(re.escape(start) + r'.*?(?=' + re.escape(end) + r')', re.S)
              updated, count = pattern.subn(replacement.rstrip() + '\n\n', text, count=1)
              if count != 1:
                  raise SystemExit(f'{label}: expected one section, found {count}')
              return updated

          common_evidence = (
              f'- backend PR #94 exact green head: `{p1_head}`;\n'
              f'- backend PR #94 merge: `{p1_merge}`;\n'
          )

          roadmap_path = Path('ROADMAP_PROGRESS.md')
          roadmap = roadmap_path.read_text()
          roadmap = replace_once(
              roadmap,
              '- mobile `main`: `ac468c103db07ecb6b550535ed77aa72898fb68d`;\n- backend `main`: `84e4100b85d24bfee04be2dbea0130fd95be3370`;',
              f'- mobile `main`: `{mobile_main}`;\n- backend `main`: `{backend_main}`;',
              'roadmap baseline',
          )
          roadmap = replace_once(
              roadmap,
              '- mobile PR #363 merge: `ac468c103db07ecb6b550535ed77aa72898fb68d`;\n',
              '- mobile PR #363 merge: `ac468c103db07ecb6b550535ed77aa72898fb68d`;\n' + common_evidence,
              'roadmap evidence',
          )
          roadmap_p1 = f'''### P1 — storage and immutable delivery adapters

Status: active. The private S3-compatible object-storage slice is merged; immutable media delivery and bounded prefix cleanup remain active.

Backend PR #94, exact green head `{p1_head}`, merge `{p1_merge}`:

- added dependency-free S3 Signature Version 4 primitives and bounded HTTPS transport;
- added a production S3-compatible private object-storage adapter behind the existing provider-neutral contract;
- bound private quarantine uploads to exact method, object key, content type, content length, signed headers, and expiry;
- added signed `HEAD`, bounded private `GET`, conditional immutable private `PUT`, and idempotent exact-object deletion;
- added metadata, checksum, namespace, expiry, duplicate-write, malformed-response, and privacy-safe conformance coverage;
- composed the adapter only in the backend composition root;
- made only private object storage operationally ready while preserving disabled product behavior.

Remaining P1 boundary:

- immutable derivative upload with exact JPEG metadata and SHA-256 verification;
- `public, max-age=31536000, immutable` enforcement;
- trusted configured delivery-base URL construction;
- refusal to replace an existing key with different bytes;
- bounded exact-prefix listing and cleanup for validated managed-media asset prefixes;
- partial-publication recovery and reusable immutable-delivery conformance tests.

Managed-media product capabilities remain unavailable until delivery, classifier, and OCR providers are ready and the explicit product flag is enabled. No real provider call, credential, bucket, CDN, deployment, worker, or upload activation was performed.'''
          roadmap = replace_section(
              roadmap,
              '### P1 — storage and immutable delivery adapters',
              '### P2 — worker entrypoints and orchestration',
              roadmap_p1,
              'roadmap P1',
          )
          roadmap = roadmap.replace(
              'Start with the first bounded P1 backend slice: audit the existing object-storage and media-delivery contracts, implement the smallest complete S3-compatible private-storage or immutable-delivery adapter boundary with strict configuration and deterministic conformance tests,',
              'Backend PR #94 completed the private S3-compatible object-storage slice from exact green head `f0a199ac4c797d6b025fb48226502a7edddcab9e` as merge `a2d4f67db3000785facb11e2d69cacb8cda03bc3`. Start with the next bounded P1 backend slice: implement immutable media delivery using the shared SigV4 and bounded transport primitives, trusted public URL construction, immutable cache metadata, and validated asset-prefix cleanup with deterministic conformance tests,',
          )
          roadmap_path.write_text(roadmap)

          implementation_path = Path('docs/implementation-plan.md')
          implementation = implementation_path.read_text()
          implementation = replace_once(
              implementation,
              '- mobile `main`: `ac468c103db07ecb6b550535ed77aa72898fb68d`;\n- backend `main`: `84e4100b85d24bfee04be2dbea0130fd95be3370`;',
              f'- mobile `main`: `{mobile_main}`;\n- backend `main`: `{backend_main}`;',
              'implementation baseline',
          )
          implementation = replace_once(
              implementation,
              '- mobile PR #363 merge: `ac468c103db07ecb6b550535ed77aa72898fb68d`;\n',
              '- mobile PR #363 merge: `ac468c103db07ecb6b550535ed77aa72898fb68d`;\n' + common_evidence,
              'implementation evidence',
          )
          implementation_next = f'''## Current P1 status

The first bounded P1 backend slice was merged in backend PR #94 from exact green head `{p1_head}` as merge `{p1_merge}`.

Completed private-storage scope:

- dependency-free, provider-neutral S3 Signature Version 4 and bounded HTTPS transport primitives;
- production S3-compatible private object storage selected only in the composition root;
- narrowly scoped presigned quarantine `PUT` uploads with exact key, method, MIME, size, signed headers, and expiry;
- signed `HEAD`, bounded private `GET`, conditional immutable private `PUT`, and idempotent exact-object deletion;
- content length, content type, ETag, last-modified, and optional SHA-256 validation;
- fail-closed namespace, endpoint, malformed-response, duplicate-write, checksum, and bounded-read behavior;
- deterministic conformance tests without credentials or real network calls.

The private provider may be `configured` and `ready`, but credentials still do not enable the product. Aggregate managed-media capabilities remain unavailable because immutable delivery, classifier, and OCR adapters are not operationally ready.

## Next bounded slice

Continue P1 with the immutable media-delivery adapter:

- reuse the merged SigV4 and bounded HTTPS primitives rather than introducing provider SDK payloads into domain code;
- upload only strict named JPEG variants under owner-opaque content-hashed keys;
- verify SHA-256, content length, content type, ETag or metadata, and immutable cache-control;
- reject mutable replacement and unsafe public-base URLs;
- implement bounded exact-prefix listing and cleanup only for validated managed-media asset prefixes;
- cover duplicate writes, missing objects, prefix isolation, partial publication, cleanup replay, malformed responses, and redacted errors;
- compose the provider only at the application root and keep product enablement disabled.

No credentials, buckets, public access, CDN, real provider calls, deployment, workers, or environment activation are required or authorized.'''
          implementation = replace_section(
              implementation,
              '## Next bounded slice',
              '## Execution rules',
              implementation_next,
              'implementation next slice',
          )
          implementation_path.write_text(implementation)

          provider_path = Path('docs/roadmap/provider-readiness.md')
          provider = provider_path.read_text()
          provider = replace_once(
              provider,
              '- mobile `main`: `ac468c103db07ecb6b550535ed77aa72898fb68d`;\n- backend `main`: `84e4100b85d24bfee04be2dbea0130fd95be3370`;',
              f'- mobile `main`: `{mobile_main}`;\n- backend `main`: `{backend_main}`;',
              'provider baseline',
          )
          provider = replace_once(
              provider,
              '- mobile PR #363 merge: `ac468c103db07ecb6b550535ed77aa72898fb68d`;\n',
              '- mobile PR #363 merge: `ac468c103db07ecb6b550535ed77aa72898fb68d`;\n' + common_evidence,
              'provider evidence',
          )
          provider_p1 = f'''## Phase P1 — S3-compatible private storage and immutable delivery adapters

Status: active. Private object storage is merged; immutable delivery and validated prefix cleanup remain incomplete.

Merged private-storage evidence:

- backend PR #94 exact green head: `{p1_head}`;
- backend PR #94 merge: `{p1_merge}`;
- exact head passed lint, formatting, TypeScript build, production configuration validation, migrations and idempotency, migrated-schema integration, PostgreSQL Social API integration, full Vitest, and production startup/health.

Private object storage:

- [x] implement a production S3-compatible adapter usable with AWS S3, Cloudflare R2, Backblaze B2 S3 API, MinIO, or another explicitly configured compatible endpoint;
- [x] create narrowly scoped presigned private `PUT` uploads with exact method, content type, content length, expiry, signed headers, and key namespace;
- [x] implement signed `HEAD`, bounded private `GET`, conditional immutable private `PUT`, and idempotent exact-object deletion;
- [x] verify returned content length, media type, ETag, last-modified metadata, optional SHA-256 metadata, and missing-object behavior;
- [x] reject path traversal, foreign namespaces, unsafe endpoint configuration, unbounded reads, mutable replacement, malformed metadata, and inconsistent response bytes;
- [x] keep quarantine and moderation-master objects private and compose the concrete provider only in the application root;
- [ ] add bounded prefix operations only through an exact validated managed-media prefix contract where cleanup requires them.

Immutable delivery:

- [ ] implement immutable derivative upload with SHA-256 verification and exact JPEG metadata;
- [ ] enforce `public, max-age=31536000, immutable` for public variants;
- [ ] refuse replacement of an existing key with different content;
- [ ] implement exact object and asset-prefix cleanup with partial-publication recovery;
- [ ] build public URLs only from a configured trusted CDN or delivery base URL;
- [ ] preserve owner-opaque public paths and strict named variant sets.

Validation:

- [x] add deterministic signing and private-storage conformance coverage for expiry, MIME and size binding, missing objects, bounded reads, duplicate writes, idempotent exact deletion, namespace isolation, checksum mismatch, malformed metadata, and secret non-disclosure;
- [ ] extend the reusable conformance suite for immutable publication, bounded prefix enumeration and deletion, prefix isolation, cleanup replay, and partial-publication recovery;
- [x] retain deterministic in-memory providers for unit and PostgreSQL integration tests;
- [x] keep CI independent of real credentials and network calls.

Next bounded P1 slice:

- reuse the merged SigV4 and bounded HTTPS transport primitives for immutable delivery;
- add strict list/delete support only for exact validated asset prefixes;
- keep provider-specific XML or HTTP payloads inside the adapter;
- preserve delivery-worker state-version, lease, stale-worker, partial-cleanup, and approval-transition boundaries;
- keep the aggregate capability unavailable until delivery, classifier, and OCR readiness and explicit product enablement are all true.

No provider credential, real call, bucket, public ACL, CDN, deployment, worker activation, public upload activation, or production environment change was performed.'''
          provider = replace_section(
              provider,
              '## Phase P1 — S3-compatible private storage and immutable delivery adapters',
              '## Phase P2 — production worker entrypoints and orchestration',
              provider_p1,
              'provider P1',
          )
          provider_path.write_text(provider)
      - name: Commit exact roadmap synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP_PROGRESS.md docs/implementation-plan.md docs/roadmap/provider-readiness.md
          git commit -m "docs: record P1 private storage adapter"
          git push origin HEAD:agent/p1-private-storage-roadmap-sync
