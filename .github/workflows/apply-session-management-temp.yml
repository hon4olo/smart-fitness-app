name: Apply mobile session management wiring

on:
  push:
    branches: [agent/session-management]
    paths:
      - .github/workflows/apply-session-management-temp.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-management
      - name: Patch auth contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/auth/createAuthService.ts')
          text = path.read_text()
          text = text.replace(
              "  AuthSession,\n  AuthTokens,",
              "  AuthSession,\n  AuthSessionSummary,\n  AuthTokens,",
          )
          anchor = "    deleteAccount: async (password: string): Promise<AccountDeletionResult> => {"
          methods = """    listSessions: async (): Promise<AuthSessionSummary[]> => {
              const accessToken = await getAccessToken();
              if (!accessToken) throw new Error('Authentication is required to manage sessions.');
              const response = await apiClient.request<{ sessions: AuthSessionSummary[] }>({
                method: 'GET',
                path: '/v1/auth/sessions',
                headers: authHeader(accessToken),
                retry: false,
              });
              return response.sessions;
            },
            revokeSession: async (sessionId: string): Promise<void> => {
              const accessToken = await getAccessToken();
              if (!accessToken) throw new Error('Authentication is required to manage sessions.');
              await apiClient.request<{ success: true }>({
                method: 'DELETE',
                path: `/v1/auth/sessions/${encodeURIComponent(sessionId)}`,
                headers: authHeader(accessToken),
                retry: false,
              });
            },
            revokeOtherSessions: async (): Promise<number> => {
              const accessToken = await getAccessToken();
              if (!accessToken) throw new Error('Authentication is required to manage sessions.');
              const response = await apiClient.post<{ success: true; revokedCount: number }, undefined>(
                '/v1/auth/sessions/revoke-others',
                undefined,
                { headers: authHeader(accessToken), retry: false },
              );
              return response.revokedCount;
            },
""" + anchor
          if anchor not in text:
              raise SystemExit('createAuthService anchor missing')
          path.write_text(text.replace(anchor, methods))

          path = Path('src/auth/AuthContext.tsx')
          text = path.read_text()
          text = text.replace(
              "  AuthSession,\n  AuthService,",
              "  AuthSession,\n  AuthSessionSummary,\n  AuthService,",
          )
          text = text.replace(
              "  changePassword(input: ChangePasswordInput): Promise<void>;\n  deleteAccount",
              "  changePassword(input: ChangePasswordInput): Promise<void>;\n  listSessions(): Promise<AuthSessionSummary[]>;\n  revokeSession(sessionId: string): Promise<void>;\n  revokeOtherSessions(): Promise<number>;\n  deleteAccount",
          )
          text = text.replace(
              "      deleteAccount: async (password) => {",
              "      listSessions: () => service.listSessions(),\n      revokeSession: (sessionId) => service.revokeSession(sessionId),\n      revokeOtherSessions: () => service.revokeOtherSessions(),\n      deleteAccount: async (password) => {",
          )
          path.write_text(text)

          path = Path('src/repositories/RepositoryFactory.ts')
          text = path.read_text()
          text = text.replace(
              "  async deleteAccount() {\n    throw new Error('Auth service is unavailable');\n  },",
              "  async listSessions() {\n    return [];\n  },\n  async revokeSession() {\n    throw new Error('Auth service is unavailable');\n  },\n  async revokeOtherSessions() {\n    throw new Error('Auth service is unavailable');\n  },\n  async deleteAccount() {\n    throw new Error('Auth service is unavailable');\n  },",
          )
          path.write_text(text)

          path = Path('src/components/auth/AuthGateCard.tsx')
          text = path.read_text()
          text = text.replace(
              "          <SecondaryButton\n            label=\"Change password\"",
              "          <SecondaryButton\n            label=\"Devices & sessions\"\n            onPress={() => router.push('/account/sessions')}\n          />\n          <SecondaryButton\n            label=\"Change password\"",
          )
          path.write_text(text)

          path = Path('src/auth/index.ts')
          text = path.read_text()
          text = text.replace(
              "  AuthSession,\n  AuthSessionRecord,",
              "  AuthSession,\n  AuthSessionRecord,\n  AuthSessionSummary,",
          )
          path.write_text(text)
          PY
      - name: Format and commit
        run: |
          npx prettier --write src/auth/createAuthService.ts src/auth/AuthContext.tsx src/repositories/RepositoryFactory.ts src/components/auth/AuthGateCard.tsx src/auth/index.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat: wire mobile session management"
          git push origin HEAD:agent/session-management
