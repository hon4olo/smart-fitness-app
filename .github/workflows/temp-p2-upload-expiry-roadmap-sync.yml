name: Temporary P2 Upload Expiry Roadmap Sync

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Synchronize canonical P2 expiry status
        run: python .github/scripts/temp-sync-p2-upload-expiry.py
      - name: Commit exact roadmap synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP_PROGRESS.md docs/implementation-plan.md docs/roadmap/provider-readiness.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record P2 upload expiry worker slice"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
